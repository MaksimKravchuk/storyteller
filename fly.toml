app = "storyteller-quest"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

# Primary HTTP service: the player web UI (FastAPI / uvicorn).
# Reachable at https://storyteller-quest.fly.dev
[http_service]
  internal_port = 8070
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

# Secondary HTTP service: the admin dashboard (aiohttp).
# Reachable at https://storyteller-quest.fly.dev:8080
# Same machine as the web UI — both are spawned by run_server.py.
#
# Note: when a port has `handlers = ["tls", "http"]`, Fly terminates TLS
# at the edge and then forwards HTTP to the app. `force_https` is NOT
# allowed on such a port — the TLS handler already guarantees the inbound
# connection is encrypted. (The primary [http_service] block above is a
# shorthand Fly knows how to expand correctly; this raw [[services]]
# form does not accept force_https alongside the tls handler.)
[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 8080
    handlers = ["tls", "http"]

  [[services.http_checks]]
    grace_period = "30s"
    interval = "15s"
    method = "get"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "rolling"
