app = "storyteller-quest"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

# Painted story-poster illustrations are on for this beta: Max's D010 spend
# decision of 2026-09-30 for the proof-of-concept beta. The flag is app-wide:
# every invited account can paint up to the per-player quota (ADR-0020,
# "Amendment 2026-09-30"). The config.py default stays false.
[env]
  POSTER_IMAGES_ENABLED = "true"

# Primary HTTP service: the player web UI (FastAPI / uvicorn).
# Reachable at https://storyteller-quest.fly.dev
[http_service]
  internal_port = 8070
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "rolling"
