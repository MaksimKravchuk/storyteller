[flake8]
max-line-length = 120
max-doc-length = 120

extend-exclude =
    alembic/,
    .claude,
    .claude/*,
    .venv/,
    __pycache__,
    .git

# WPS rules not yet fixed — remove from this list as each is resolved
# WPS201: too many imports in a module
# WPS202: too many module members
# WPS214: too many methods in a class
# W503: line break before binary operator — conflicts with PEP 8 / ruff
# E704: statement on one line — conflicts with ruff-format's Protocol stub style
ignore =
    WPS201,
    WPS202,
    WPS214,
    W503,
    E704
