[flake8]
max-line-length = 120
max-doc-length = 120

extend-exclude =
    alembic/,
    .claude/,
    .venv/,
    __pycache__,
    .git

# WPS rules not yet fixed — remove from this list as each is resolved
ignore =
    WPS110,
    WPS111,
    WPS114,
    WPS118,
    WPS201,
    WPS202,
    WPS204,
    WPS210,
    WPS211,
    WPS213,
    WPS214,
    WPS217,
    WPS218,
    WPS220,
    WPS221,
    WPS223,
    WPS226,
    WPS229,
    WPS230,
    WPS231,
    WPS232,
    WPS234,
    WPS235,
    WPS237,
    WPS243,
    WPS322,
    WPS335,
    WPS336,
    WPS338,
    WPS347,
    WPS358,
    WPS420,
    WPS430,
    WPS431,
    WPS432,
    WPS441,
    WPS459,
    WPS476,
    WPS504,
    WPS505,
    WPS520,
    WPS527,
    WPS529,
    WPS602,
    # W503: line break before binary operator — conflicts with PEP 8 / ruff
    W503,
    # E704: statement on one line — conflicts with ruff-format's Protocol stub style
    E704
