[flake8]
max-line-length = 120
max-doc-length = 120

extend-exclude =
    alembic/,
    .claude,
    .claude/*,
    .venv/,
    __pycache__,
    .git

# W503: line break before binary operator — conflicts with PEP 8 / ruff
# E704: statement on one line — conflicts with ruff-format's Protocol stub style
# E203: whitespace before ':' — conflicts with ruff-format's slice style
ignore =
    W503,
    E704,
    E203

per-file-ignores =
    # dice.py: contest system + backward-compat aliases require extra members
    cast/dice.py: WPS202
    # director.py: orchestrator needs many imports by nature; many-arg init after DirectorDeps/DirectorCast removal
    cast/director.py: WPS201, WPS211
    # dialogue_helpers: contest + combat builders share a module
    cast/director_dialogue_helpers.py: WPS202
    # director_execution: plan executor needs methods & awaits for each delegation step; many-arg init after _Agents removal
    cast/director_execution.py: WPS211, WPS214, WPS217
    # engine_wiring: wire_director signature grows after DirectorContext removal
    engine/engine_wiring.py: WPS211
    # game_engine: GameEngine.__init__ signature grows after EngineModels removal; _make_clients adds one more method
    engine/game_engine.py: WPS211, WPS214
    # npc_turn: turn resolution module has several helpers by necessity
    cast/npc_turn.py: WPS202
    # knowledge/graph: node/edge CRUD plus the actor-marker helper forms the public API surface
    knowledge/graph.py: WPS214
    # markdown_render: regex dispatcher + closures for tag wrapping
    formatting/markdown_render.py: WPS202, WPS430
    # test files: structural WPS rules are relaxed for tests
    tests/test_*.py: WPS110, WPS111, WPS114, WPS118, WPS202, WPS204, WPS210, WPS214, WPS218, WPS221, WPS226, WPS347, WPS432, WPS520
    tests/db/test_*.py: WPS110, WPS111, WPS114, WPS118, WPS202, WPS204, WPS210, WPS214, WPS218, WPS221, WPS226, WPS347, WPS432, WPS520
    # e2e test files: real-LLM smoke tests share the same structural shape as unit tests
    # — descriptive method names, multiple asserts per scenario, NPCCard fixtures at module level.
    tests/e2e/test_*.py: WPS110, WPS111, WPS114, WPS118, WPS202, WPS204, WPS210, WPS214, WPS218, WPS221, WPS226, WPS347, WPS432, WPS520
    # consumer-seam contract tests: structurally orchestrators (drive every critical performer
    # × locale) so they share the cast/director.py exemption for WPS201/WPS203 alongside the
    # standard test-file relaxations. Helper modules under tests/prompts/_*.py carry the same
    # set so the split (state / kwargs / cases) does not move violations between files.
    tests/prompts/test_*.py: WPS110, WPS111, WPS114, WPS118, WPS201, WPS202, WPS203, WPS204, WPS210, WPS214, WPS218, WPS221, WPS226, WPS347, WPS432, WPS520
    tests/prompts/_*.py: WPS110, WPS111, WPS114, WPS118, WPS201, WPS202, WPS203, WPS204, WPS210, WPS214, WPS218, WPS221, WPS226, WPS347, WPS432, WPS520
    # conftest: pytest hook signature uses `items`/`item`, and the file holds fixtures + the allure-label enforcement hook
    tests/conftest.py: WPS110, WPS202
    tests/db/conftest.py: WPS110, WPS202, WPS213
