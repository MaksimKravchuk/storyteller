[flake8]
max-line-length = 120
max-doc-length = 120

extend-exclude =
    alembic/,
    .claude/,
    .venv/,
    __pycache__,
    .git

# WPS rules not yet fixed — remove from this list as each is resolved
# WPS111: too short name (< 2 chars)
# WPS114: underscored number in name
# WPS118: too long function name
# WPS201: too many imports in a module
# WPS202: too many module members
# WPS204: overused expression
# WPS210: too many local variables
# WPS211: too many arguments
# WPS213: too many expressions
# WPS214: too many methods in a class
# WPS217: too many await expressions
# WPS218: too many assert statements
# WPS220: too deep nesting
# WPS221: line with high Jones complexity
# WPS223: too many elif branches
# WPS226: string literal used too many times (should be a constant)
# WPS229: too long try body
# WPS230: too many public instance attributes
# WPS231: function with too much cognitive complexity
# WPS232: module with too much cognitive complexity
# WPS234: too complex annotation
# WPS235: too many imported names from a single module
# WPS237: too complex f-string
# WPS243: naked raise outside of except block
# WPS322: multiline string outside of assignments
# WPS335: wrong variable used in for loop
# WPS336: explicit string concatenation (use join or f-string)
# WPS338: wrong method order in class
# WPS347: vague import that may cause name confusion
# WPS358: multiline conditions
# WPS420: wrong keyword: pass
# WPS430: nested function definition
# WPS431: nested class definition
# WPS432: magic number
# WPS441: control variable used after for/with block
# WPS459: comparison with float
# WPS476: await inside a for loop body
# WPS504: negated condition in else branch
# WPS505: nested function with too much cognitive complexity
# WPS520: use of not with a comparison (prefer !=)
# WPS527: non-tuple passed where tuple is expected (e.g. % formatting)
# WPS529: implicit dict.get() usage (subscript inside if key in dict)
# WPS602: use of @staticmethod (prefer module-level function or @classmethod)
# W503: line break before binary operator — conflicts with PEP 8 / ruff
# E704: statement on one line — conflicts with ruff-format's Protocol stub style
ignore =
    WPS111,
    WPS114,
    WPS118,
    WPS201,
    WPS202,
    WPS204,
    WPS210,
    WPS211,
    WPS213,
    WPS214,
    WPS217,
    WPS218,
    WPS220,
    WPS221,
    WPS223,
    WPS226,
    WPS229,
    WPS230,
    WPS231,
    WPS232,
    WPS234,
    WPS235,
    WPS237,
    WPS243,
    WPS322,
    WPS335,
    WPS336,
    WPS338,
    WPS347,
    WPS358,
    WPS420,
    WPS430,
    WPS431,
    WPS432,
    WPS441,
    WPS459,
    WPS476,
    WPS504,
    WPS505,
    WPS520,
    WPS527,
    WPS529,
    WPS602,
    W503,
    E704
