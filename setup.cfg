[flake8]
max-line-length = 120
max-doc-length = 120

extend-exclude =
    alembic/,
    .claude,
    .claude/*,
    .venv/,
    __pycache__,
    .git

# WPS rules not yet fixed — remove from this list as each is resolved
# WPS201: too many imports in a module
# WPS202: too many module members
# WPS204: overused expression
# WPS214: too many methods in a class
# WPS220: too deep nesting
# WPS230: too many public instance attributes
# WPS231: function with too much cognitive complexity
# WPS232: module with too much cognitive complexity
# W503: line break before binary operator — conflicts with PEP 8 / ruff
# E704: statement on one line — conflicts with ruff-format's Protocol stub style
ignore =
    WPS201,
    WPS202,
    WPS204,
    WPS214,
    WPS220,
    WPS230,
    WPS231,
    WPS232,
    W503,
    E704
