[flake8]
max-line-length = 120
max-doc-length = 120
max-cognitive-score = 17
max-module-members = 30
max-imports = 17
max-local-variables = 10

extend-exclude =
    alembic/,
    .claude,
    .claude/*,
    .venv/,
    __pycache__,
    .git

# W503: line break before binary operator — conflicts with PEP 8 / ruff
# E704: statement on one line — conflicts with ruff-format's Protocol stub style
# E203: whitespace before ':' — conflicts with ruff-format's slice style
ignore =
    W503,
    E704,
    E203,
    WPS476,
    WPS441

per-file-ignores =
    # dice.py: contest system + backward-compat aliases require extra members
    cast/dice.py: WPS202
    # director.py: orchestrator needs many imports by nature
    cast/director.py: WPS201
    # dialogue_helpers: contest + combat builders share a module
    cast/director_dialogue_helpers.py: WPS202
    # director_execution: plan executor needs methods & awaits for each delegation step
    cast/director_execution.py: WPS214, WPS217
    # npc_turn: turn resolution module has several helpers by necessity
    cast/npc_turn.py: WPS202
    # knowledge/graph: node/edge CRUD plus the actor-marker helper forms the public API surface
    knowledge/graph.py: WPS214
    # markdown_render: regex dispatcher + closures for tag wrapping
    formatting/markdown_render.py: WPS202, WPS430
    # test files: structural WPS rules are relaxed for tests
    tests/test_*.py: WPS110, WPS111, WPS114, WPS118, WPS202, WPS204, WPS210, WPS214, WPS218, WPS221, WPS226, WPS347, WPS432, WPS520
    tests/db/test_*.py: WPS110, WPS111, WPS114, WPS118, WPS202, WPS204, WPS210, WPS214, WPS218, WPS221, WPS226, WPS347, WPS432, WPS520
    # conftest: pytest hook signature uses `items`/`item`, and the file holds fixtures + the allure-label enforcement hook
    tests/conftest.py: WPS110, WPS202
    tests/db/conftest.py: WPS110, WPS202, WPS213
