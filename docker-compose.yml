services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: storyteller
      POSTGRES_PASSWORD: storyteller
      POSTGRES_DB: storyteller
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyteller"]
      interval: 5s
      timeout: 3s
      retries: 5

  storyteller:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://storyteller:storyteller@postgres:5432/storyteller
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://storyteller:storyteller@postgres:5432/storyteller
    command:
      - sh
      - -c
      - >-
        uv run alembic upgrade head &&
        exec uv run uvicorn interfaces.web.app:app
        --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
