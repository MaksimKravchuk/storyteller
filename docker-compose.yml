services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: storyteller
      POSTGRES_PASSWORD: storyteller
      POSTGRES_DB: storyteller
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyteller"]
      interval: 5s
      timeout: 3s
      retries: 5

  storyteller:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://storyteller:storyteller@postgres:5432/storyteller
    ports:
      - "8080:8080"  # admin dashboard
      - "8070:8070"  # player web UI
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8070/healthz').read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
