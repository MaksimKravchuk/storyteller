<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storyteller</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Storyteller</h1>
    <button id="new-game-btn" type="button" hidden>New game</button>
  </header>

  <main id="app">
    <p id="loading">Loading…</p>

    <section id="setting-panel" hidden>
      <h2>Start a new quest</h2>
      <form id="setting-form">
        <label for="language-select">Story language:</label>
        <select id="language-select" name="language">
          <option value="English" selected>English</option>
          <option value="Russian">Русский</option>
          <option value="Spanish">Español</option>
          <option value="French">Français</option>
          <option value="German">Deutsch</option>
          <option value="Japanese">日本語</option>
        </select>

        <label for="setting-input">Describe the setting (place, era, mood):</label>
        <textarea
          id="setting-input"
          name="setting"
          rows="4"
          maxlength="500"
          required
          placeholder="e.g. Rome, 1st century AD, during the reign of Augustus"
        ></textarea>

        <fieldset id="character-fields">
          <legend>Your character</legend>
          <p class="hint">
            Describe yourself however you like — leave fields blank to stay anonymous,
            or click <em>Use template</em> for a plausible default.
          </p>

          <label for="char-name">Name (optional)</label>
          <input
            id="char-name"
            name="name"
            type="text"
            maxlength="128"
            autocomplete="off"
            placeholder="Leave empty if you'd rather stay anonymous"
          />

          <label for="char-appearance">Appearance</label>
          <textarea
            id="char-appearance"
            name="appearance"
            rows="2"
            maxlength="500"
            placeholder="Average build, dark hair, jeans and a t-shirt"
          ></textarea>

          <label for="char-inventory">Inventory (comma-separated)</label>
          <input
            id="char-inventory"
            name="inventory"
            type="text"
            maxlength="500"
            autocomplete="off"
            placeholder="phone, wallet, keys"
          />

          <button type="button" id="use-template-btn">Use template</button>
        </fieldset>

        <button type="submit">Start</button>
      </form>
      <p id="setting-status" class="status"></p>
    </section>

    <section id="game-panel" hidden>
      <div class="game-grid">
        <div class="transcript-col">
          <div id="log" aria-live="polite"></div>
          <form id="action-form">
            <input
              id="action-input"
              name="action"
              type="text"
              maxlength="2000"
              required
              autocomplete="off"
              placeholder="What do you do?"
            />
            <button type="submit" id="action-submit">Act</button>
          </form>
          <div id="next-actions" aria-label="Suggested next actions">
            <span>Try next:</span>
            <button type="button" data-action="look around">look around</button>
            <button type="button" data-action="talk to someone nearby">talk to someone nearby</button>
            <button type="button" data-action="check my inventory">check my inventory</button>
          </div>
          <p id="action-status" class="status"></p>
        </div>
        <aside class="character-col" id="character-panel" aria-label="Character">
          <h3>Character</h3>
          <div id="character-header"></div>
          <section class="char-section">
            <h4>Inventory</h4>
            <ul id="inventory-list"></ul>
          </section>
          <section class="char-section">
            <h4>Memory</h4>
            <h5>People you know</h5>
            <ul id="known-npcs-list"></ul>
            <h5>Recent events</h5>
            <ul id="recent-events-list"></ul>
            <h5>Things you've learned</h5>
            <ul id="learned-facts-list"></ul>
          </section>
        </aside>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
