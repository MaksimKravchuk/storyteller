<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storyteller Admin</title>
<style>
  :root {
    --bg: #0e1220; --panel: #151a2c; --raised: #1b2137; --inset: #0b0f1b;
    --border: #242b44; --border-strong: #333c5e;
    --text: #e7e9f2; --muted: #9aa1bb; --faint: #646c8a;
    --accent: #e94560; --accent-hover: #d13a54; --link: #8f96ff;
    --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --info: #60a5fa;
    --radius: 8px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 13.5px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; overflow: hidden; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }

  /* Buttons & inputs */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--raised); border: 1px solid var(--border-strong); border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: background .12s, border-color .12s; }
  .btn:hover { background: #232a45; border-color: #424c75; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--raised); color: var(--text); }
  .btn-sm { padding: 3px 9px; font-size: 12px; }
  .input, select.input { padding: 7px 10px; background: var(--inset); color: var(--text); border: 1px solid var(--border-strong); border-radius: 6px; font-size: 13px; min-width: 0; }
  .input:focus { outline: none; border-color: var(--link); box-shadow: 0 0 0 3px rgba(143,150,255,.15); }
  .segmented { display: inline-flex; background: var(--inset); border: 1px solid var(--border-strong); border-radius: 7px; padding: 2px; }
  .segmented button { background: none; border: none; padding: 4px 12px; border-radius: 5px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .segmented button.active { background: var(--accent); color: #fff; }

  /* Left rail */
  .rail { width: 196px; flex-shrink: 0; background: #0b0f1c; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 18px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), #8f5bff); display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 14px; }
  .brand-name { font-weight: 700; font-size: 14px; }
  .brand-tag { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; }
  .nav-link { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; background: none; border-radius: 6px; color: var(--muted); cursor: pointer; text-align: left; font-size: 13.5px; }
  .nav-link svg { width: 17px; height: 17px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav-link:hover { background: var(--panel); color: var(--text); }
  .nav-link.active { background: var(--raised); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
  .nav-link.active svg { color: var(--accent); }
  .rail-spacer { flex: 1; }
  .account-wrap { border-top: 1px solid var(--border); padding: 10px 6px 0; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  .account-email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* List panel (sessions / users) */
  .list-panel { width: 310px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .list-panel > div { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .list-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 8px; font-weight: 600; }
  .list-search { padding: 0 12px 10px; border-bottom: 1px solid var(--border); }
  .list-search .input { width: 100%; }
  .list { overflow-y: auto; flex: 1; }
  .list-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; border-left: 3px solid transparent; }
  .list-item:hover { background: var(--raised); }
  .list-item.active { background: var(--raised); border-left-color: var(--accent); }
  .li-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .li-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-meta { font-size: 12px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-pinned { color: var(--link); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .count { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 9px; background: var(--raised); border: 1px solid var(--border); color: var(--muted); font-size: 11px; text-align: center; font-weight: 500; }

  /* Main */
  .main { flex: 1; overflow-y: auto; min-width: 0; }
  .page { padding: 22px 28px 40px; max-width: 1400px; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-head h1 { font-size: 20px; font-weight: 650; letter-spacing: -.2px; }
  .page-sub { color: var(--muted); font-size: 12.5px; margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dot { color: var(--faint); }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar .input { width: 260px; }
  .toolbar .spacer { flex: 1; }
  .help { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 28px 4px; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--faint); padding: 14px 4px; }
  .empty-state { text-align: center; padding: 18vh 20px; color: var(--muted); }
  .empty-state h2 { color: var(--text); font-size: 16px; margin-bottom: 6px; font-weight: 600; }
  .empty-state kbd, .kbd { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; color: var(--text); }
  .error-box { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.35); color: var(--err); padding: 12px 14px; border-radius: var(--radius); }

  /* Tabs */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
  .tab { padding: 8px 14px; cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .subtabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .subtab { padding: 5px 12px; cursor: pointer; border: 1px solid var(--border); background: none; border-radius: 999px; color: var(--muted); font-size: 12.5px; text-transform: capitalize; }
  .subtab:hover { color: var(--text); }
  .subtab.active { background: var(--raised); border-color: var(--border-strong); color: var(--text); }

  /* Cards, kv, stats */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .card h3 { color: var(--muted); margin-bottom: 12px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; display: flex; align-items: center; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .grid > .card { margin-bottom: 0; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 7px 14px; }
  .kv .label { color: var(--muted); }
  .kv > div { min-width: 0; overflow-wrap: anywhere; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .stat-link { cursor: pointer; }
  .stat-link:hover { border-color: var(--border-strong); background: var(--raised); }
  .stat-value { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat-label { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .prose { white-space: pre-wrap; color: #cfd3e3; }

  /* Tables */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); }
  .card .table-wrap { border: none; background: none; margin: 0 -4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 9px 10px; color: var(--muted); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(255,255,255,.018); }
  tr.row-link { cursor: pointer; }
  tr.row-link:hover td { background: var(--raised); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.hot { color: var(--err); font-weight: 600; }
  td.zero { color: var(--faint); }
  td.wrap { max-width: 520px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }

  /* Badges & chips */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-plain::before { display: none; }
  .badge-playing, .badge-green { background: rgba(74,222,128,.1); color: var(--ok); border-color: rgba(74,222,128,.25); }
  .badge-idle { background: rgba(154,161,187,.1); color: var(--muted); border-color: rgba(154,161,187,.22); }
  .badge-awaiting { background: rgba(251,191,36,.1); color: var(--warn); border-color: rgba(251,191,36,.25); }
  .badge-red { background: rgba(248,113,113,.1); color: var(--err); border-color: rgba(248,113,113,.28); }
  .badge-info { background: rgba(96,165,250,.1); color: var(--info); border-color: rgba(96,165,250,.25); }
  .agent-badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--agent, #8a8fc4); background: color-mix(in srgb, var(--agent, #8a8fc4) 15%, transparent); border: 1px solid color-mix(in srgb, var(--agent, #8a8fc4) 35%, transparent); }
  .id-chip { font-family: var(--mono); font-size: 11.5px; color: var(--link); background: rgba(143,150,255,.08); border: 1px solid rgba(143,150,255,.2); border-radius: 4px; padding: 0 5px; cursor: copy; }
  .id-chip:hover { background: rgba(143,150,255,.16); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; margin: 2px 3px 2px 0; background: var(--raised); border: 1px solid var(--border); color: #c9cde0; }
  .view-link { color: var(--link); cursor: pointer; }
  .view-link:hover { text-decoration: underline; }
  .traits-chip, .npc-tag { display: inline-block; background: rgba(181,124,255,.12); color: #c9a6ff; border: 1px solid rgba(181,124,255,.25); padding: 1px 8px; border-radius: 999px; font-size: 11px; margin: 2px 3px 2px 0; }
  .npc-tag { cursor: pointer; }
  .npc-tag:hover { background: rgba(181,124,255,.22); }
  .inv-chip, .item-chip { display: inline-block; background: rgba(255,179,71,.1); color: #ffc677; border: 1px solid rgba(255,179,71,.25); padding: 1px 8px; border-radius: 999px; font-size: 11px; margin: 2px 3px 2px 0; cursor: help; }
  .inv-chip { cursor: default; }
  .object-chip { display: inline-block; background: rgba(91,213,200,.1); color: #5bd5c8; border: 1px solid rgba(91,213,200,.25); padding: 1px 8px; border-radius: 999px; font-size: 11px; cursor: help; }
  .dice-chip { display: inline-block; background: rgba(143,150,255,.1); color: var(--link); padding: 1px 9px; border-radius: 999px; font-size: 11px; border: 1px solid rgba(143,150,255,.25); cursor: help; }
  .dice-chip.dice-actor-win { background: rgba(74,222,128,.1); color: var(--ok); border-color: rgba(74,222,128,.25); }
  .dice-chip.dice-target-win, .dice-chip.dice-aggr-attack { background: rgba(248,113,113,.1); color: var(--err); border-color: rgba(248,113,113,.28); }
  .dice-chip.dice-aggr-calm { background: rgba(251,191,36,.1); color: var(--warn); border-color: rgba(251,191,36,.25); }
  .turn-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }

  /* Disclosure (details) */
  details > summary { cursor: pointer; user-select: none; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  .disclosure > summary { display: inline-flex; align-items: center; gap: 6px; color: var(--link); font-size: 12px; font-weight: 500; }
  .disclosure > summary::before { content: '▸'; font-size: 10px; transition: transform .12s; }
  .disclosure[open] > summary::before { transform: rotate(90deg); }
  .disclosure > summary:hover { color: #b7bcff; }

  /* Scenes & turns */
  .scene-block { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
  .scene-block.current { border-color: rgba(74,222,128,.35); }
  .scene-header { padding: 12px 16px; cursor: pointer; user-select: none; display: flex; gap: 12px; align-items: flex-start; }
  .scene-header:hover { background: var(--raised); }
  .chev { color: var(--faint); transition: transform .12s; margin-top: 1px; }
  .chev::before { content: '▾'; }
  .scene-block.collapsed .chev { transform: rotate(-90deg); }
  .scene-block.collapsed .scene-body { display: none; }
  .scene-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .scene-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .scene-body { padding: 4px 16px 14px; border-top: 1px solid var(--border); }
  .scene-info { display: flex; gap: 20px; flex-wrap: wrap; padding: 10px 0; }
  .scene-info table { margin-top: 6px; font-size: 12px; }
  .scene-info td, .scene-info th { padding: 4px 8px; }
  .scene-desc { font-size: 12.5px; color: var(--muted); margin: 6px 0 12px; font-style: italic; }
  .log-entry { background: var(--inset); border: 1px solid var(--border); border-radius: 7px; padding: 12px 14px; margin-top: 10px; }
  .log-entry .turn-info { font-size: 11px; color: var(--faint); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .6px; }
  .log-entry .action { color: var(--link); font-weight: 600; }
  .log-entry .response { margin-top: 6px; white-space: pre-wrap; color: #cfd3e3; }
  .setup-header { font-weight: 600; margin-bottom: 4px; }
  .ai-calls { margin-top: 10px; }
  .ai-calls-body { margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--border); }

  /* AI call entries */
  .ai-call-entry { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; margin-bottom: 6px; font-size: 12px; }
  .ai-call-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .ai-call-meta { color: var(--faint); font-size: 11px; font-family: var(--mono); }
  .ai-call-detail[open] { margin-top: 2px; }
  .ai-call-copy-bar { display: flex; gap: 6px; margin: 8px 0; }
  .ai-call-detail h4 { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin: 10px 0 4px; font-weight: 600; }
  .ai-call-tree-children { margin-left: 18px; border-left: 2px solid var(--border); padding-left: 12px; }
  .call-seq-badge { font-family: var(--mono); background: var(--raised); color: var(--muted); font-size: 10px; padding: 1px 6px; border-radius: 4px; }
  .code-block { background: var(--inset); border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px; font: 11.5px/1.5 var(--mono); color: #c3c7d8; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
  .user-log-group { background: var(--inset); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .session-inline-logs { display: flex; gap: 8px; flex-wrap: wrap; }
  .session-inline-logs > details { flex: 1 1 220px; }
  .user-log-entry { margin-top: 8px; max-height: 240px; }

  /* Structured LLM messages */
  .msg-block { margin: 6px 0; border-left: 3px solid var(--border-strong); padding: 6px 10px; background: var(--inset); border-radius: 0 5px 5px 0; }
  .msg-system { border-left-color: #d5c85b; }
  .msg-user { border-left-color: #5bd58a; }
  .msg-assistant { border-left-color: #b57cff; }
  .msg-tool { border-left-color: #5bd5c8; }
  .msg-role-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; color: var(--muted); }
  .msg-system .msg-role-badge { color: #d5c85b; }
  .msg-user .msg-role-badge { color: #5bd58a; }
  .msg-assistant .msg-role-badge { color: #b57cff; }
  .msg-tool .msg-role-badge { color: #5bd5c8; }
  .msg-block pre { color: #d6d9e6; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }

  /* JSON tree */
  .json-tree { font: 12px/1.5 var(--mono); color: #ddd; background: var(--inset); border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px; max-height: 420px; overflow: auto; }
  .json-tree details { padding-left: 14px; }
  .json-tree details > summary { margin-left: -14px; }
  .json-tree details > summary::before { content: '▸ '; color: var(--faint); }
  .json-tree details[open] > summary::before { content: '▾ '; }
  .json-key { color: var(--link); }
  .json-str { color: #5bd58a; }
  .json-num { color: #ffb347; }
  .json-bool { color: var(--accent); }
  .json-null { color: #888; font-style: italic; }
  .json-punct { color: var(--faint); }

  /* Agent-flow graph (n8n-style: HTML nodes layered over an SVG edge canvas) */
  .agent-flow-legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }
  .agent-flow-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
  .agent-flow-legend .sw { width: 18px; height: 14px; border-radius: 4px; display: inline-block; }
  .agent-flow-legend .sw-llm { background: linear-gradient(135deg,#b57cff,#5b9bd5); }
  .agent-flow-legend .sw-det { background: #1b2a48; border: 1.5px solid #5bd5c8; }
  .agent-flow-legend .ln { width: 22px; height: 0; border-top: 2px solid #5b6abf; }
  .agent-flow-legend .ln-det { border-top: 2px dashed #5bd5c8; }
  .agent-flow-canvas { position: relative; overflow: auto; max-height: 70vh; background: radial-gradient(circle at center, #1b2544 1px, transparent 1px) 0 0 / 22px 22px, #0b1020; border: 1px solid var(--border); border-radius: var(--radius); }
  .agent-flow-stage { position: relative; }
  .agent-flow-edges { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
  .agent-flow-edge { fill: none; stroke: #44508f; stroke-width: 1.6; opacity: 0.85; }
  .agent-flow-edge--det { stroke: #2f7d77; stroke-dasharray: 5 4; }
  .agent-flow-edge.hot { stroke: #ffffff; opacity: 1; stroke-width: 2.4; }
  .agent-flow-edge-label { font-size: 10px; fill: #aab0ff; }
  .flow-node { position: absolute; box-sizing: border-box; border-radius: 9px; cursor: pointer; background: var(--panel); border: 1px solid #2a3b66; padding: 7px 9px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s, opacity .12s; }
  .flow-node:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.5); }
  .flow-node.selected { outline: 2px solid #fff; outline-offset: 1px; }
  .flow-node.dim { opacity: 0.32; }
  .flow-node__head { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .flow-node__pill { font-size: 8px; font-weight: 700; letter-spacing: .5px; padding: 1px 5px; border-radius: 6px; }
  .flow-node__icon { font-size: 13px; line-height: 1; }
  .flow-node__title { font-size: 12.5px; font-weight: 600; color: #f0f2ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flow-node__model { font-size: 9.5px; color: #8a93b8; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flow-node__out { font-size: 10px; color: #c3c9e0; margin-top: 3px; line-height: 1.25; max-height: 26px; overflow: hidden; }
  .flow-node__foot { font-size: 9px; color: #6f7aa0; margin-top: 4px; display: flex; justify-content: space-between; gap: 6px; }
  .flow-node--llm { border-left: 4px solid var(--agent, #8a8fc4); }
  .flow-node--llm .flow-node__pill { background: var(--agent, #8a8fc4); color: #0f1a30; }
  .flow-node--det { background: #131f38; border: 1px solid #2c4a66; border-left: 4px solid #5bd5c8; border-radius: 5px; }
  .flow-node--det .flow-node__pill { background: #0d3b39; color: #5bd5c8; border: 1px solid #2f7d77; }
  .flow-node--det .flow-node__title { font-family: var(--mono); font-size: 11.5px; }
  .flow-node--lane { background: #101a30; border: 1px dashed #3a4a72; }
  .flow-node--lane .flow-node__pill { background: #1b2440; color: #8a93b8; }
  #agent-flow-detail { margin-top: 14px; }
  .det-kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 12px; margin-bottom: 10px; }
  .det-kv dt { color: #5bd5c8; font-family: var(--mono); }
  .det-kv dd { margin: 0; overflow-wrap: anywhere; }

  /* NPC detail */
  .npc-detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .npc-detail-header h2 { font-size: 17px; }

  /* Settings */
  .role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
  .settings-role { background: var(--inset); border: 1px solid var(--border); border-radius: 7px; padding: 14px; }
  .settings-role h4 { font-size: 13px; text-transform: capitalize; margin-bottom: 4px; }
  .settings-role .current { font-size: 12px; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .settings-role .current code { color: var(--text); }
  .settings-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .settings-row:last-child { margin-bottom: 0; }
  .settings-row .input { flex: 1 1 180px; }
  .field-label { color: var(--muted); font-size: 12px; min-width: 110px; }

  /* Login */
  .login-overlay { position: fixed; inset: 0; background: radial-gradient(circle at 30% 20%, #1c2140, var(--bg) 60%); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .login-card { width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .login-card .brand { padding: 0 0 20px; }
  .login-card label { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 5px; }
  .login-card .input { width: 100%; padding: 9px 11px; font-size: 14px; }
  .login-card .btn { width: 100%; justify-content: center; margin-top: 20px; padding: 9px; font-size: 14px; }
  .login-status { color: var(--warn); font-size: 12px; margin-top: 12px; min-height: 1em; }

  /* Toasts */
  .toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
  .toast { background: var(--raised); border: 1px solid var(--border-strong); border-left: 3px solid var(--ok); padding: 9px 14px; border-radius: 7px; box-shadow: 0 8px 24px rgba(0,0,0,.4); max-width: 380px; animation: toast-in .16s ease-out; }
  .toast-err { border-left-color: var(--err); }
  @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

  @media (max-width: 1100px) {
    .rail { width: 58px; padding: 14px 8px; }
    .brand-name, .brand-tag, .nav-link span, .account-email { display: none; }
    .brand { padding: 4px 7px 18px; }
    .nav-link { justify-content: center; padding: 9px 0; }
    .list-panel { width: 270px; }
    .page { padding: 18px 18px 32px; }
  }
</style>
</head>
<body>

<div id="toasts" class="toasts" aria-live="polite"></div>

<div id="login-overlay" class="login-overlay" hidden>
  <form class="login-card" onsubmit="onAdminLogin(event)">
    <div class="brand"><span class="brand-mark">S</span><span class="brand-name">Storyteller</span><span class="brand-tag">admin</span></div>
    <label for="login-email">Email</label>
    <input id="login-email" class="input" type="email" autocomplete="email" required>
    <label for="login-password">Password</label>
    <input id="login-password" class="input" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit">Log in</button>
    <div id="login-status" class="login-status" role="status"></div>
  </form>
</div>

<nav class="rail">
  <div class="brand"><span class="brand-mark">S</span><span class="brand-name">Storyteller</span><span class="brand-tag">admin</span></div>
  <button id="nav-sessions" class="nav-link" title="Sessions" onclick="showView('sessions')">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Sessions</span></button>
  <button id="nav-users" class="nav-link" title="Users" onclick="showView('users')">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.1.7 3.5 2.7 3.5 5.7"/></svg><span>Users</span></button>
  <button id="nav-feedback" class="nav-link" title="Feedback" onclick="showView('feedback')">
    <svg viewBox="0 0 24 24"><path d="M5 21V4h12l-2 4 2 4H5"/></svg><span>Feedback</span></button>
  <button id="nav-reliability" class="nav-link" title="Reliability" onclick="showView('reliability')">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg><span>Reliability</span></button>
  <button id="nav-settings" class="nav-link" title="Settings" onclick="showView('settings')">
    <svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Settings</span></button>
  <div class="rail-spacer"></div>
  <div id="account-wrap" class="account-wrap" hidden>
    <span id="account-email" class="account-email"></span>
    <button class="btn btn-sm" type="button" onclick="onAdminLogout()" title="Log out">Log out</button>
  </div>
</nav>

<aside id="list-panel" class="list-panel">
  <div id="sessions-nav-content">
    <div class="list-head"><span>Sessions</span><span id="session-count" class="count"></span></div>
    <div class="list-search">
      <input id="session-search" class="input search" type="search"
             placeholder="Search id / player…   /" oninput="onSearchInput()">
    </div>
    <div id="session-list" class="list"></div>
  </div>
  <div id="users-nav-content" hidden>
    <div class="list-head"><span>Users</span><span id="user-count" class="count"></span></div>
    <div class="list-search">
      <input id="user-search" class="input search" type="search"
             placeholder="Search by email…   /" oninput="onUserSearchInput()">
    </div>
    <div class="list">
      <div id="nav-invites" class="list-item" onclick="go('#/users')">
        <div class="li-pinned">✉ Beta invites</div>
        <div class="li-meta">Invite or re-enable testers</div>
      </div>
      <div id="user-list"></div>
    </div>
  </div>
</aside>

<main class="main" id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const API = '';
let _settingsCatalog = [];
let _settingsKeys = {};
let currentView = 'sessions';
let currentSessionId = null;
let currentUserId = null;
let currentTab = 'overview';
let currentNpcId = null;
let currentNpcTab = 'state';
let searchDebounceTimer = null;
let userSearchDebounceTimer = null;
const SEARCH_DEBOUNCE_MS = 250;
let supabaseClient = null;
const _sessionsById = {};

const VIEWS = ['sessions', 'users', 'feedback', 'reliability', 'settings'];
const SESSION_TABS = [
  ['overview', 'Overview'], ['scenes', 'Scenes'], ['npcs', 'NPCs'], ['locations', 'Locations'],
  ['events', 'Events'], ['knowledge', 'Knowledge'], ['models', 'Models'], ['flow', 'Agent flow'],
];
const LOADING = '<div class="loading"><span class="spinner"></span>Loading…</div>';

// ---- Small rendering helpers ----

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}
function fmtNum(n) { return n == null ? '—' : Number(n).toLocaleString(); }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString() : '—'; }
function fmtRel(iso) {
  if (!iso) return '—';
  const sec = (Date.now() - new Date(iso)) / 1000;
  let text = new Date(iso).toLocaleDateString();
  if (sec < 45) text = 'just now';
  else if (sec < 3600) text = `${Math.round(sec / 60)}m ago`;
  else if (sec < 86400) text = `${Math.round(sec / 3600)}h ago`;
  else if (sec < 604800) text = `${Math.round(sec / 86400)}d ago`;
  return `<span title="${escapeHtml(fmtDate(iso))}">${text}</span>`;
}
function idChip(id) {
  const full = String(id || '');
  if (!full) return '—';
  return `<span class="id-chip" title="${escapeHtml(full)} — click to copy" onclick="event.stopPropagation(); copyText('${escapeHtml(full)}', 'ID')">${escapeHtml(full.slice(0, 8))}</span>`;
}
function agentBadge(name) {
  return `<span class="agent-badge" style="--agent:${agentColor(name)}">${escapeHtml(name || '?')}</span>`;
}
function pageHeader(titleHtml, subHtml, actionsHtml) {
  return `<header class="page-head"><div><h1>${titleHtml}</h1>${subHtml ? `<div class="page-sub">${subHtml}</div>` : ''}</div>
    <div class="page-actions">${actionsHtml || ''}</div></header>`;
}
function emptyState(title, hint) {
  return `<div class="empty-state"><h2>${title}</h2>${hint ? `<div>${hint}</div>` : ''}</div>`;
}
function errorBox(what, e) { return `<div class="error-box">Error loading ${escapeHtml(what)}: ${escapeHtml(e.message)}</div>`; }
function statTile(label, value, tab) {
  const link = tab ? ` class="stat stat-link" onclick="switchTab('${tab}')"` : ' class="stat"';
  return `<div${link}><div class="stat-value">${value}</div><div class="stat-label">${escapeHtml(label)}</div></div>`;
}
// headers: list of labels, or [label, 'num'] for right-aligned numeric columns.
function tableHtml(headers, rowsHtml, id) {
  const ths = headers.map(h => Array.isArray(h) ? `<th class="${h[1]}">${h[0]}</th>` : `<th>${h}</th>`).join('');
  return `<div class="table-wrap"><table${id ? ` id="${id}"` : ''}><thead><tr>${ths}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
}
function filterInput(tableId, placeholder) {
  return `<input class="input" type="search" placeholder="${escapeHtml(placeholder || 'Filter…')}" oninput="filterRows(this, '${tableId}')">`;
}
function filterRows(input, tableId) {
  const q = input.value.trim().toLowerCase();
  document.querySelectorAll(`#${tableId} tbody tr`).forEach(tr => {
    tr.hidden = !!q && !tr.textContent.toLowerCase().includes(q);
  });
}
function main() { return document.getElementById('main'); }
function setPage(html) { main().innerHTML = `<div class="page">${html}</div>`; }

function toast(message, kind) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'err' ? ' toast-err' : '');
  el.textContent = message;
  document.getElementById('toasts').append(el);
  setTimeout(() => el.remove(), kind === 'err' ? 6000 : 2600);
}
function copyText(text, label) {
  navigator.clipboard.writeText(text).then(() => toast(`${label || 'Text'} copied`), () => toast('Copy failed', 'err'));
}

// ---- Auth ----

// Returns true when the dashboard may load: auth is off (local dev) or a session exists.
async function initAuth() {
  const cfg = await (await fetch(API + '/config/public')).json();
  if (!cfg.beta_auth_required) return true;
  if (!(cfg.supabase_url && cfg.supabase_publishable_key && window.supabase)) {
    showLogin('Login is not configured for this deployment.');
    return false;
  }
  supabaseClient = window.supabase.createClient(cfg.supabase_url, cfg.supabase_publishable_key);
  const { data } = await supabaseClient.auth.getSession();
  if (!data.session) {
    showLogin('');
    return false;
  }
  showAccount(data.session.user.email);
  return true;
}

function showLogin(message) {
  document.getElementById('login-overlay').hidden = false;
  document.getElementById('login-status').textContent = message;
}

function showAccount(email) {
  document.getElementById('account-email').textContent = email || '';
  document.getElementById('account-email').title = email || '';
  document.getElementById('account-wrap').hidden = false;
}

async function onAdminLogin(event) {
  event.preventDefault();
  if (!supabaseClient) return;
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    showLogin(error.message);
    return;
  }
  location.reload();
}

async function onAdminLogout() {
  if (supabaseClient) await supabaseClient.auth.signOut();
  location.reload();
}

async function authHeaders(extra) {
  const headers = Object.assign({}, extra || {});
  if (!supabaseClient) return headers;
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) headers.Authorization = 'Bearer ' + data.session.access_token;
  return headers;
}

async function fetchJSON(url, options) {
  const opts = Object.assign({}, options || {});
  opts.headers = await authHeaders(opts.headers);
  const res = await fetch(API + url, opts);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) showLogin('Your session has expired. Please log in again.');
  if (res.status === 403) showLogin('This account does not have the admin role.');
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function downloadFeedbackCsv() {
  const res = await fetch(API + '/api/admin/beta/feedback.csv', { headers: await authHeaders() });
  if (!res.ok) return toast(`Export failed: HTTP ${res.status}`, 'err');
  const link = document.createElement('a');
  link.href = URL.createObjectURL(await res.blob());
  link.download = 'beta-feedback.csv';
  link.click();
  URL.revokeObjectURL(link.href);
}

// ---- Routing: the URL hash is the source of truth so reload / back / links keep context ----
//   #/sessions/<id>/<tab>            #/sessions/<id>/npcs/<npcId>/<subtab>
//   #/users[/<id>]   #/feedback   #/reliability[/<window>]   #/settings

function go(hash) {
  if (location.hash === hash) route();
  else location.hash = hash;
}

function sessionHash(sessionId, tab) {
  if (tab === 'npc-detail') return `#/sessions/${sessionId}/npcs/${currentNpcId}/${currentNpcTab}`;
  return `#/sessions/${sessionId}/${tab || 'overview'}`;
}

function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  const view = VIEWS.includes(parts[0]) ? parts[0] : 'sessions';
  currentView = view;
  VIEWS.forEach(v => document.getElementById('nav-' + v).classList.toggle('active', v === view));
  document.getElementById('sessions-nav-content').hidden = view !== 'sessions';
  document.getElementById('users-nav-content').hidden = view !== 'users';
  document.getElementById('list-panel').hidden = view !== 'sessions' && view !== 'users';

  if (view === 'sessions') {
    currentSessionId = parts[1] || null;
    const tab = parts[2] || 'overview';
    if (tab === 'npcs' && parts[3]) {
      currentTab = 'npc-detail';
      currentNpcId = parts[3];
      currentNpcTab = parts[4] || 'state';
    } else {
      currentTab = SESSION_TABS.some(([key]) => key === tab) ? tab : 'overview';
    }
    markActive('session-list', currentSessionId);
    renderTab();
  } else if (view === 'users') {
    currentUserId = parts[1] || null;
    document.getElementById('nav-invites').classList.toggle('active', !currentUserId);
    loadUsers();
    if (currentUserId) renderUserDetail();
    else renderUsersHome();
  } else if (view === 'feedback') {
    renderFeedbackView();
  } else if (view === 'reliability') {
    if (_RELIABILITY_WINDOWS.includes(parts[1])) _reliabilityWindow = parts[1];
    renderReliabilityView();
  } else {
    renderSettingsView();
  }
}

function showView(view) {
  if (view === 'sessions' && currentSessionId) return go(sessionHash(currentSessionId, currentTab));
  if (view === 'users' && currentUserId) return go('#/users/' + currentUserId);
  go('#/' + view);
}

function markActive(listId, id) {
  document.querySelectorAll(`#${listId} .list-item`).forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
}

// ---- Sessions list ----

function currentSearchTerm() {
  const el = document.getElementById('session-search');
  return el ? el.value.trim() : '';
}

function onSearchInput() {
  if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => loadSessions(currentSearchTerm()), SEARCH_DEBOUNCE_MS);
}

function currentUserSearchTerm() {
  const el = document.getElementById('user-search');
  return el ? el.value.trim() : '';
}

function onUserSearchInput() {
  if (userSearchDebounceTimer) clearTimeout(userSearchDebounceTimer);
  userSearchDebounceTimer = setTimeout(() => loadUsers(), SEARCH_DEBOUNCE_MS);
}

function badgeClass(state) {
  if (state === 'playing') return 'badge-playing';
  if (state === 'idle') return 'badge-idle';
  return 'badge-awaiting';
}
function stateBadge(state) { return `<span class="badge ${badgeClass(state)}">${escapeHtml(state || '—')}</span>`; }

async function loadSessions(search) {
  const term = (search ?? currentSearchTerm()).trim();
  const qs = term ? '?search=' + encodeURIComponent(term) : '';
  const data = await fetchJSON('/api/sessions' + qs);
  const sessions = data.sessions || [];
  sessions.forEach(s => { _sessionsById[s.id] = s; });
  document.getElementById('session-count').textContent = sessions.length;
  const list = document.getElementById('session-list');
  if (!sessions.length) {
    list.innerHTML = `<div class="empty" style="padding:14px">${term ? 'No matching sessions' : 'No sessions yet'}</div>`;
    return;
  }
  list.innerHTML = sessions.map(s => `
    <div class="list-item ${s.id === currentSessionId ? 'active' : ''}" data-id="${escapeHtml(s.id)}" onclick="selectSession('${s.id}')">
      <div class="li-top"><span class="li-title">${escapeHtml(s.title || s.setting || 'Untitled game')}</span>${stateBadge(s.state)}</div>
      <div class="li-meta">${renderOwnerLabel(s)} · ${fmtRel(s.updated_at)}</div>
      <div class="li-meta"><span class="mono faint">${escapeHtml((s.id || '').slice(0, 8))}</span> · ${escapeHtml(s.language || '')} · turn ${s.turn_count ?? 0}${s.game_time ? ' · ' + escapeHtml(s.game_time) : ''}</div>
    </div>`).join('');
}

function renderOwnerLabel(s) {
  if (s.account_email && s.account_id) {
    return `<span class="view-link" onclick="event.stopPropagation(); openUserFromCrossLink('${s.account_id}')">${escapeHtml(s.account_email)}</span>`;
  }
  return '<span class="faint">no owner</span>';
}

function openUserFromCrossLink(accountId) { go('#/users/' + accountId); }

function selectSession(id) {
  go(sessionHash(id, currentTab === 'npc-detail' ? 'npcs' : currentTab));
}

// ---- Users ----

async function loadUsers() {
  const term = currentUserSearchTerm();
  const qs = term ? '?email_query=' + encodeURIComponent(term) : '';
  const data = await fetchJSON('/api/admin/users' + qs);
  const list = document.getElementById('user-list');
  const users = data.users || [];
  document.getElementById('user-count').textContent = users.length;
  if (!users.length) {
    list.innerHTML = '<div class="empty" style="padding:14px">No users</div>';
    return;
  }
  list.innerHTML = users.map(u => {
    const id = String(u.id || '');
    const email = escapeHtml(u.email || id.slice(0, 8) || 'Unknown user');
    return `
    <div class="list-item ${id === currentUserId ? 'active' : ''}" data-id="${escapeHtml(id)}" onclick="selectUser('${id}')">
      <div class="li-top"><span class="li-title">${email}</span>${u.is_admin ? '<span class="badge badge-info">admin</span>' : ''}</div>
      <div class="li-meta">${escapeHtml(u.plan || '—')} · ${fmtNum(u.session_count ?? 0)} sessions</div>
      <div class="li-meta">${fmtNum(u.call_count ?? 0)} calls · ${fmtNum(u.total_tokens ?? 0)} tokens</div>
    </div>`;
  }).join('');
}

function selectUser(id) { go('#/users/' + id); }

function openUserSession(id) { go(`#/sessions/${id}/scenes`); }

async function renderUserDetail() {
  if (!currentUserId) return;
  setPage(LOADING);
  try {
    const data = await fetchJSON(`/api/admin/users/${currentUserId}`);
    const account = data.account || {};
    const usage = data.usage || {};
    const sessions = data.sessions || [];
    const invites = data.invites || [];
    const feedback = data.feedback || [];
    const sub = [idChip(account.id), escapeHtml(account.plan || '—'), `joined ${fmtRel(account.created_at)}`].join('<span class="dot">·</span>');
    setPage(`${pageHeader(`${escapeHtml(account.email || 'User')} ${account.is_admin ? '<span class="badge badge-info">admin</span>' : ''}`, sub)}
    <div class="stats">
      ${statTile('Sessions', fmtNum(sessions.length))}
      ${statTile('AI calls', fmtNum(usage.call_count ?? 0))}
      ${statTile('Prompt tokens', fmtNum(usage.prompt_tokens ?? 0))}
      ${statTile('Completion tokens', fmtNum(usage.completion_tokens ?? 0))}
      ${statTile('Total tokens', fmtNum(usage.total_tokens ?? 0))}
    </div>
    <div class="card"><h3>Account</h3><div class="kv">
      <div class="label">Email</div><div>${escapeHtml(account.email || '')}</div>
      <div class="label">Account ID</div><div><code>${escapeHtml(account.id || '')}</code></div>
      <div class="label">Supabase ID</div><div><code>${escapeHtml(account.supabase_user_id || '—')}</code></div>
      <div class="label">Plan</div><div>${escapeHtml(account.plan || '—')}</div>
      <div class="label">Admin</div><div>${account.is_admin ? 'yes' : 'no'}</div>
      <div class="label">Created</div><div>${fmtDate(account.created_at)}</div>
      <div class="label">Updated</div><div>${fmtDate(account.updated_at)}</div>
    </div></div>
    <div class="card"><h3>Sessions <span class="count">${sessions.length}</span></h3>${renderUserSessionsTable(sessions)}</div>
    <div class="card"><h3>Invites <span class="count">${invites.length}</span></h3>${renderUserInvitesTable(invites)}</div>
    <div class="card"><h3>Feedback <span class="count">${feedback.length}</span></h3>${renderUserFeedbackTable(feedback)}</div>`);
  } catch (e) {

// ---- Agent-flow graph (n8n-style per-turn pipeline: LLM vs deterministic nodes) ----
//
// Two telemetry streams feed this view, both per-turn:
//   * /ai-calls     — non-deterministic LLM calls (agent_name, model, parent_agent,
//                     call_sequence, prompt/response). These form the call tree.
//   * /turn-events  — deterministic ops (clock_advance, dice_*, hostility_*, item_*).
//                     Each carries the agent_name that was active when it fired, so we
//                     attach it as a leaf on that agent's LLM node (or an "Engine" lane
//                     when no agent owns it).
// The two streams have independent ordering counters and batch-flushed timestamps, so
// we do NOT interleave them into one global timeline — the LLM call tree is the skeleton
// and deterministic events hang off the agent that produced them.

const AGENT_COLORS = {
  Director: '#e94560', Narrator: '#5b9bd5', SceneBuilder: '#5bd58a', Actor: '#b57cff',
  NPCGenerator: '#ffb347', DataMiner: '#5bd5c8', MemoryManager: '#d5c85b',
  Dramaturge: '#ff7cb0', WorldChronicler: '#c8d55b', ItemGenerator: '#5bd5a8',
};
function agentColor(name) { return AGENT_COLORS[name] || '#8a8fc4'; }

function _firstLine(s) {
  if (!s) return '';
  const t = String(s).trim();
  const nl = t.indexOf('\n');
  return nl >= 0 ? t.slice(0, nl) : t;
}
function _truncate(s, n) { s = s || ''; return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function _fmtDur(ms) { return ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms'; }
function _llmFoot(c) {
  const tok = [c.prompt_tokens, c.completion_tokens].filter(x => x != null);
  const parts = [];
  if (tok.length) parts.push(tok.join('+') + ' tok');
  if (c.duration_ms != null) parts.push(_fmtDur(c.duration_ms));
  return parts.join(' · ');
}
function _fmtVal(v) {
  if (v == null) return '—';
  if (Array.isArray(v)) return v.length ? v.join(', ') : '[]';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

// Per-event-type icon + title + one-line "data produced" summary for deterministic nodes.
function _detMeta(ev) {
  const p = ev.payload || {};
  switch (ev.event_type) {
    case 'clock_advance': return { icon: '🕐', title: 'Clock advance', summary: _clockSummary(p) };
    case 'dice_contest': return { icon: '🎲', title: 'Dice contest', summary: `${p.outcome || 'contest'} — actor ${p.actor_roll ?? '?'}+${p.actor_bonus ?? 0} vs ${p.target_roll ?? '?'}+${p.target_bonus ?? 0}` };
    case 'dice_combat': return { icon: '⚔️', title: 'Dice combat', summary: `${p.outcome || 'combat'} — player ${p.player_roll ?? '?'} vs npc ${p.npc_roll ?? '?'}+${p.npc_bonus ?? 0}` };
    case 'dice_aggression': return { icon: '⚔️', title: 'Aggression roll', summary: `${p.mood || '?'} — d20 ${p.roll ?? '?'} vs ${p.threshold ?? '?'} → ${p.will_attack ? 'attacks' : 'holds'}` };
    case 'item_list': return { icon: '📦', title: 'Item expansion', summary: (p.expanded || []).join(', ') || 'items' };
    case 'item_examine': return { icon: '🔍', title: 'Examine item', summary: p.item_name || 'item' };
    case 'object_interaction': return { icon: '🛠️', title: 'Object interaction', summary: p.object_name || 'object' };
    case 'hostility_bump': return { icon: '🔥', title: 'Hostility bump', summary: `${p.npc_name || 'npc'} +${p.severity ?? ''}` };
    case 'hostility_unknown_severity': return { icon: '🔥', title: 'Hostility (unknown)', summary: `${p.npc_name || 'npc'} ${p.severity ?? ''}` };
    case 'hostility_mood_downgrade_blocked': return { icon: '🛡️', title: 'Mood floor held', summary: `${p.npc_name || 'npc'}: ${p.attempted_mood || '?'} blocked` };
    case 'hostility_mood_unknown': return { icon: '❓', title: 'Mood unknown', summary: `${p.npc_name || 'npc'} ${p.attempted_mood || ''}` };
    case 'hostility_resolve_miss': return { icon: '❓', title: 'Aggro resolve miss', summary: `${(p.targets || []).length} target(s)` };
    default: return { icon: '⚙', title: ev.event_type, summary: _truncate(JSON.stringify(p), 80) };
  }
}
function _clockSummary(p) {
  const h = p.hours;
  const hStr = h == null ? '?' : '+' + (+h).toFixed(2).replace(/\.?0+$/, '') + 'h';
  const completed = p.completed_events || [];
  if (completed.length) return `${hStr} · completes ${completed.join(', ')}`;
  return h ? hStr : 'no time passed';
}

async function renderAgentFlow(el) {
  const [aiData, evData] = await Promise.all([

  const events = evData.turn_events || [];
  if (!calls.length && !events.length) {
    el.innerHTML = '<div class="empty">No AI calls or events recorded for this session yet.</div>';
    return;
  }
  const turns = [...new Set([...calls.map(c => c.turn_number), ...events.map(e => e.turn_number)].filter(t => t != null))]
    .sort((a, b) => a - b);
  // Default to the latest turn so the rich per-turn pipeline is what loads first.
  const defaultTurn = turns.length ? String(turns[turns.length - 1]) : 'all';
  window.__agentFlow = { calls, events, turns, turn: defaultTurn, nodes: [] };
  const turnOpts = ['<option value="all">All turns (overview)</option>']
    .concat(turns.map(t => `<option value="${t}"${String(t) === defaultTurn ? ' selected' : ''}>Turn ${t}</option>`)).join('');
  el.innerHTML = `
    <div class="toolbar">
      <button class="btn btn-sm" onclick="stepAgentFlowTurn(-1)" title="Previous turn">←</button>
      <select id="agent-flow-turn" class="input" onchange="changeAgentFlowTurn(this.value)">${turnOpts}</select>
      <button class="btn btn-sm" onclick="stepAgentFlowTurn(1)" title="Next turn">→</button>
      <span class="help" style="margin:0">Trace a turn's pipeline left→right; click a node to inspect. "All turns" shows call counts.</span>
    </div>
    <div class="agent-flow-legend">
      <span class="lg"><span class="sw sw-llm"></span> LLM node — non-deterministic</span>
      <span class="lg"><span class="sw sw-det"></span> Deterministic node — clock / dice / rules</span>
      <span class="lg"><span class="ln"></span> agent call</span>
      <span class="lg"><span class="ln ln-det"></span> deterministic op</span>
    </div>
    <div class="agent-flow-canvas" id="agent-flow-graph"></div>
    <div id="agent-flow-detail"></div>`;
  drawAgentFlow();
}

function changeAgentFlowTurn(value) {
  if (window.__agentFlow) window.__agentFlow.turn = value;
  drawAgentFlow();
}

function stepAgentFlowTurn(delta) {
  const select = document.getElementById('agent-flow-turn');
  if (!select) return;
  const next = Math.min(Math.max(select.selectedIndex + delta, 0), select.options.length - 1);
  if (next === select.selectedIndex) return;
  select.selectedIndex = next;
  changeAgentFlowTurn(select.value);
}

// Build the per-turn graph: LLM call tree + deterministic events as leaves on their agent.
function _buildTurnGraph(calls, events) {
  const nodes = [];
  const edges = [];
  const lastLlmByAgent = new Map();  // agent_name -> most recent LLM node this turn

  [...calls].sort((a, b) => (a.call_sequence ?? 0) - (b.call_sequence ?? 0)).forEach((c, i) => {
    const seq = c.call_sequence ?? i;
    const node = {
      id: `llm-${i}`, kind: 'llm', agent: c.agent_name, color: agentColor(c.agent_name),
      title: c.agent_name, model: c.model || '',
      out: _truncate(_firstLine(c.response_content), 90), foot: _llmFoot(c),
      order: seq, call: c,
    };
    nodes.push(node);
    // Attach to the most recent earlier LLM node from the parent agent (call tree).
    if (c.parent_agent && lastLlmByAgent.has(c.parent_agent)) {
      edges.push({ from: lastLlmByAgent.get(c.parent_agent).id, to: node.id, kind: 'llm' });
    }
    lastLlmByAgent.set(c.agent_name, node);
  });

  const laneByAgent = new Map();
  [...events].sort((a, b) => (a.sequence ?? 0) - (b.sequence ?? 0)).forEach((ev, i) => {
    if (ev.event_type === 'reliability_snapshot') return;  // turn-level telemetry, not a pipeline node
    const meta = _detMeta(ev);
    const node = {
      id: `det-${i}`, kind: 'det', agent: ev.agent_name || 'Engine', icon: meta.icon,
      title: meta.title, out: _truncate(meta.summary, 90),
      foot: `deterministic · #${ev.sequence ?? i}`, order: 1000 + (ev.sequence ?? i), event: ev,
    };
    nodes.push(node);
    let host = ev.agent_name ? lastLlmByAgent.get(ev.agent_name) : null;
    if (!host) {  // no owning LLM call — host on a synthetic deterministic lane
      const laneKey = ev.agent_name || 'Engine';
      host = laneByAgent.get(laneKey);
      if (!host) {
        // Synthetic index id (never embed agent_name in the id — it reaches onclick/data-id raw).
        host = { id: `lane-${laneByAgent.size}`, kind: 'lane', agent: laneKey, icon: '⚙',
          title: laneKey, out: 'deterministic engine ops', foot: 'lane', order: -1, events: [] };
        nodes.push(host);
        laneByAgent.set(laneKey, host);
      }
      host.events.push(ev);
    }
    edges.push({ from: host.id, to: node.id, kind: 'det' });
  });
  return { nodes, edges };
}

// Build the all-turns overview: one node per agent with call counts, weighted edges.
function _buildAggregateGraph(calls) {
  const agents = new Map();
  const weights = new Map();
  let i = 0;
  // Synthetic index ids (ag-0, ag-1, …) so agent_name never reaches onclick/data-id raw.
  const ensure = name => {
    if (!agents.has(name)) { agents.set(name, { count: 0, models: new Set(), order: i, id: `ag-${i}` }); i += 1; }
    return agents.get(name);
  };
  for (const c of calls) {
    const a = ensure(c.agent_name);
    a.count += 1;
    if (c.model) a.models.add(c.model);
    if (c.parent_agent) {
      ensure(c.parent_agent);
      const key = `${c.parent_agent}\u0001${c.agent_name}`;
      weights.set(key, (weights.get(key) || 0) + 1);
    }
  }
  const nodes = [...agents.entries()].map(([name, a]) => ({
    id: a.id, kind: 'llm', agent: name, color: agentColor(name), title: name,
    model: [...a.models].join(', '), out: '', foot: `${a.count} call${a.count === 1 ? '' : 's'}`,
    order: a.order, aggAgent: name,
  }));
  const edges = [...weights.entries()].map(([key, w]) => {
    const [parent, child] = key.split('\u0001');
    return { from: agents.get(parent).id, to: agents.get(child).id, kind: 'llm', weight: w };
  });
  return { nodes, edges };
}

// Layered left→right layout: BFS depth from roots, stack rows within each column.
function _layoutFlow(nodes, edges) {
  const ids = new Set(nodes.map(n => n.id));
  const children = new Map(nodes.map(n => [n.id, []]));
  const indeg = new Map(nodes.map(n => [n.id, 0]));
  for (const e of edges) {
    if (e.from === e.to || !ids.has(e.from) || !ids.has(e.to)) continue;
    children.get(e.from).push(e.to);
    indeg.set(e.to, indeg.get(e.to) + 1);
  }
  let roots = nodes.filter(n => indeg.get(n.id) === 0).map(n => n.id);
  if (!roots.length && nodes.length) roots = [nodes[0].id];
  const depth = new Map();
  const queue = [...roots];
  roots.forEach(r => depth.set(r, 0));
  while (queue.length) {
    const id = queue.shift();
    for (const child of children.get(id) || []) {
      if (!depth.has(child)) { depth.set(child, depth.get(id) + 1); queue.push(child); }
    }
  }
  const columns = new Map();
  for (const n of nodes) {
    const d = depth.has(n.id) ? depth.get(n.id) : 0;
    if (!columns.has(d)) columns.set(d, []);
    columns.get(d).push(n);
  }
  const NODE_W = 196, NODE_H = 82, COL_W = 256, ROW_GAP = 18, PAD = 28;
  let maxRows = 0;
  const maxDepth = Math.max(0, ...columns.keys());
  for (const [d, list] of columns) {
    list.sort((a, b) => a.order - b.order);
    maxRows = Math.max(maxRows, list.length);
    list.forEach((n, row) => {
      n.x = PAD + d * COL_W; n.y = PAD + row * (NODE_H + ROW_GAP); n.w = NODE_W; n.h = NODE_H;
    });
  }
  return {
    width: PAD * 2 + maxDepth * COL_W + NODE_W,
    height: PAD * 2 + Math.max(maxRows, 1) * NODE_H + Math.max(maxRows - 1, 0) * ROW_GAP,
  };
}

function drawAgentFlow() {
  const container = document.getElementById('agent-flow-graph');
  if (!container || !window.__agentFlow) return;
  const detail = document.getElementById('agent-flow-detail');
  if (detail) detail.innerHTML = '';  // reset drill-down when the turn filter changes
  const { calls, events, turn } = window.__agentFlow;
  let graph;
  if (turn === 'all') {
    graph = _buildAggregateGraph(calls);
    if (!graph.nodes.length) { container.innerHTML = '<div class="empty">No AI calls recorded yet.</div>'; return; }
  } else {
    const tc = calls.filter(c => String(c.turn_number) === String(turn));
    const te = events.filter(e => String(e.turn_number) === String(turn));
    if (!tc.length && !te.length) { container.innerHTML = '<div class="empty">No activity recorded for this turn.</div>'; return; }
    graph = _buildTurnGraph(tc, te);
  }
  const { width, height } = _layoutFlow(graph.nodes, graph.edges);
  window.__agentFlow.nodes = graph.nodes;
  _paintFlow(container, graph, width, height);
}

function _paintFlow(container, graph, width, height) {
  const byId = new Map(graph.nodes.map(n => [n.id, n]));
  const edgeSvg = graph.edges.map(e => {
    const a = byId.get(e.from), b = byId.get(e.to);
    if (!a || !b || a.x == null || b.x == null) return '';
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2, mx = (x1 + x2) / 2;
    const cls = e.kind === 'det' ? 'agent-flow-edge agent-flow-edge--det' : 'agent-flow-edge';
    const path = `<path class="${cls}" data-from="${e.from}" data-to="${e.to}" d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" marker-end="url(#af-arrow)"/>`;
    const label = e.weight ? `<text class="agent-flow-edge-label" x="${mx}" y="${(y1 + y2) / 2 - 4}" text-anchor="middle">${e.weight}</text>` : '';
    return path + label;
  }).join('');
  const nodesHtml = graph.nodes.map(_flowNodeHtml).join('');
  container.innerHTML = `
    <div class="agent-flow-stage" style="width:${width}px;height:${height}px">
      <svg class="agent-flow-edges" width="${width}" height="${height}">
        <defs><marker id="af-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
          <path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6abf"/></marker></defs>
        ${edgeSvg}
      </svg>
      ${nodesHtml}
    </div>`;
}

function _flowNodeHtml(n) {
  const style = `left:${n.x}px;top:${n.y}px;width:${n.w}px;min-height:${n.h}px;--agent:${n.color || '#8a8fc4'}`;
  const out = n.out ? `<div class="flow-node__out">${escapeHtml(n.out)}</div>` : '';
  if (n.kind === 'llm') {
    return `<div class="flow-node flow-node--llm" data-id="${n.id}" style="${style}" onclick="selectFlowNode('${n.id}')">
      <div class="flow-node__head"><span class="flow-node__pill">LLM</span><span class="flow-node__icon">✨</span><span class="flow-node__title">${escapeHtml(n.title)}</span></div>
      ${n.model ? `<div class="flow-node__model">${escapeHtml(n.model)}</div>` : ''}
      ${out}
      <div class="flow-node__foot"><span>${escapeHtml(n.foot || '')}</span></div>
    </div>`;
  }
  if (n.kind === 'lane') {
    return `<div class="flow-node flow-node--lane" data-id="${n.id}" style="${style}" onclick="selectFlowNode('${n.id}')">
      <div class="flow-node__head"><span class="flow-node__pill">LANE</span><span class="flow-node__icon">${n.icon || '⚙'}</span><span class="flow-node__title">${escapeHtml(n.title)}</span></div>
      ${out}
      <div class="flow-node__foot"><span>${(n.events || []).length} op${(n.events || []).length === 1 ? '' : 's'}</span></div>
    </div>`;
  }
  return `<div class="flow-node flow-node--det" data-id="${n.id}" style="${style}" onclick="selectFlowNode('${n.id}')">
    <div class="flow-node__head"><span class="flow-node__pill">DET</span><span class="flow-node__icon">${n.icon || '⚙'}</span><span class="flow-node__title">${escapeHtml(n.title)}</span></div>
    ${out}
    <div class="flow-node__foot"><span>${escapeHtml(n.foot || '')}</span></div>
  </div>`;
}

function selectFlowNode(id) {
  if (!window.__agentFlow) return;
  document.querySelectorAll('#agent-flow-graph .flow-node').forEach(el => {
    const sel = el.getAttribute('data-id') === id;
    el.classList.toggle('selected', sel);
    el.classList.toggle('dim', !sel);
  });
  document.querySelectorAll('#agent-flow-graph .agent-flow-edge').forEach(p => {
    const hot = p.getAttribute('data-from') === id || p.getAttribute('data-to') === id;
    p.classList.toggle('hot', hot);
  });
  const node = (window.__agentFlow.nodes || []).find(n => n.id === id);
  const panel = document.getElementById('agent-flow-detail');
  if (panel) panel.innerHTML = node ? _renderFlowDetail(node) : '';
}

function _renderFlowDetail(node) {
  if (node.kind === 'det') return _detDetailCard(node.event);
  if (node.kind === 'lane') {
    const evs = node.events || [];
    const body = evs.map(_detDetailCard).join('') || '<div class="empty">No events.</div>';
    return `<div class="card"><h3>${escapeHtml(node.title)} — ${evs.length} deterministic op${evs.length === 1 ? '' : 's'}</h3>${body}</div>`;
  }
  if (node.aggAgent) {
    const matching = (window.__agentFlow.calls || []).filter(c => c.agent_name === node.aggAgent);
    return `<div class="card"><h3>${escapeHtml(node.aggAgent)} — ${matching.length} call${matching.length === 1 ? '' : 's'} (all turns)</h3>
      ${renderAiCallEntries(matching, null) || '<div class="empty">No calls.</div>'}</div>`;
  }
  const c = node.call;
  const scope = c.turn_number != null ? `turn ${c.turn_number}` : 'setup';
  return `<div class="card"><h3>${escapeHtml(node.title)} — call #${c.call_sequence ?? ''} (${scope})</h3>
    ${renderAiCallEntries([c], c.turn_number)}</div>`;
}

function _detDetailCard(ev) {
  const meta = _detMeta(ev);

  const origin = ev.agent_name ? `emitted by ${escapeHtml(ev.agent_name)} · ` : '';
  return `<div class="card">

    <div class="help">${origin}seq #${ev.sequence ?? ''}</div>

}

function renderMessages(messages) {
  if (!Array.isArray(messages) || !messages.length) {
    return '<div class="empty">No messages</div>';
  }
  return messages.map(m => {
    const role = (m.role || 'user').toString();
    const content = typeof m.content === 'string' ? m.content : JSON.stringify(m.content, null, 2);
    return `<div class="msg-block msg-${escapeHtml(role)}">
      <div class="msg-role-badge">${escapeHtml(role)}</div>

function renderResponse(text) {
  const raw = text || '';
  try {
    const parsed = JSON.parse(raw);
    if (parsed !== null && typeof parsed === 'object') {
      return `<div class="json-tree">${renderJsonTree(parsed, 0)}</div>`;
    }
  } catch (e) {
    // not JSON — fall through to plain rendering
  }
  return `<pre class="code-block">${escapeHtml(raw)}</pre>`;
}

const _JSON_MAX_DEPTH = 6;

function renderJsonLeaf(val) {
  if (val === null) return '<span class="json-null">null</span>';
  if (typeof val === 'boolean') return `<span class="json-bool">${val}</span>`;
  if (typeof val === 'number') return `<span class="json-num">${val}</span>`;
  if (typeof val === 'string') return `<span class="json-str">${escapeHtml(JSON.stringify(val))}</span>`;
  return `<span class="json-str">${escapeHtml(String(val))}</span>`;
}

function renderJsonTree(obj, depth) {
  if (depth > _JSON_MAX_DEPTH) return '<span class="json-null">…</span>';
  if (obj === null || typeof obj !== 'object') return renderJsonLeaf(obj);
  if (Array.isArray(obj)) {
    if (!obj.length) return '<span class="json-punct">[]</span>';
    const items = obj.map((v, i) => `<div>${renderJsonTree(v, depth + 1)}${i < obj.length - 1 ? '<span class="json-punct">,</span>' : ''}</div>`).join('');
    return `<details open><summary><span class="json-punct">[</span> <span class="json-num">${obj.length}</span> <span class="json-punct">]</span></summary>${items}</details>`;
  }
  const keys = Object.keys(obj);
  if (!keys.length) return '<span class="json-punct">{}</span>';
  const items = keys.map((k, i) => `<div><span class="json-key">${escapeHtml(JSON.stringify(k))}</span><span class="json-punct">: </span>${renderJsonTree(obj[k], depth + 1)}${i < keys.length - 1 ? '<span class="json-punct">,</span>' : ''}</div>`).join('');
  return `<details open><summary><span class="json-punct">{</span> <span class="json-num">${keys.length}</span> <span class="json-punct">}</span></summary>${items}</details>`;
}

window.__aiCallCache = window.__aiCallCache || {};

function copyCallPrompt(uid, kind) {
  const c = window.__aiCallCache[uid];
  if (!c) return;
  if (kind === 'system') {
    copyText(c.system_prompt || '', 'System prompt');
  } else {

  }
}

function renderSingleCall(c, turnNumber) {
  const tokens = [c.prompt_tokens, c.completion_tokens].filter(x => x != null);
  const tokenStr = tokens.length ? tokens.join('+') + ' tok' : '';
  const durStr = c.duration_ms != null ? _fmtDur(c.duration_ms) : '';
  const metaParts = [c.model, tokenStr, durStr].filter(Boolean).map(escapeHtml).join(' · ');
  const uid = 'aic-' + Math.random().toString(36).slice(2, 10);
  window.__aiCallCache[uid] = { system_prompt: c.system_prompt, messages: c.messages };
  const seqBadge = c.call_sequence != null ? `<span class="call-seq-badge">${turnNumber != null ? turnNumber + '.' + c.call_sequence : '#' + c.call_sequence}</span>` : '';
  return `
    <div class="ai-call-entry">
      <div class="ai-call-header">
        ${seqBadge}
        ${agentBadge(c.agent_name)}
        <span class="ai-call-meta">${metaParts}</span>
      </div>
      <details class="ai-call-detail disclosure"><summary>Prompt &amp; response</summary>
        <div class="ai-call-copy-bar">
          <button type="button" class="btn btn-sm" onclick="copyCallPrompt('${uid}', 'system')">Copy system</button>
          <button type="button" class="btn btn-sm" onclick="copyCallPrompt('${uid}', 'full')">Copy full prompt (JSON)</button>
        </div>
        ${renderSystemPrompt(c.system_prompt)}
        <h4>Messages sent</h4>
        ${renderMessages(c.messages)}
        <h4>Response</h4>
        ${renderResponse(c.response_content)}
      </details>
    </div>`;
}

function renderAiCallEntries(calls, turnNumber) {
  if (!calls || !calls.length) return '';

  // Sort by call_sequence (fallback to original order)
  const sorted = [...calls].sort((a, b) =>
    (a.call_sequence ?? 0) - (b.call_sequence ?? 0)
  );

  // Build tree: root nodes (parent_agent=null), children grouped under parent
  const roots = [];
  for (const call of sorted) {
    if (!call.parent_agent) {
      roots.push({ call, children: [] });
    } else {
      // Attach to most recent root from the parent agent
      let attached = false;
      for (let i = roots.length - 1; i >= 0; i--) {
        if (roots[i].call.agent_name === call.parent_agent) {
          roots[i].children.push(call);
          attached = true;
          break;
        }
      }
      if (!attached) roots.push({ call, children: [] });
    }
  }

  return roots.map(node => {
    const rootHtml = renderSingleCall(node.call, turnNumber);
    if (!node.children.length) return rootHtml;
    const childHtml = node.children.map(c => renderSingleCall(c, turnNumber)).join('');
    return `${rootHtml}<div class="ai-call-tree-children">${childHtml}</div>`;
  }).join('');
}

function aiCallsSection(calls, turnNumber) {
  if (!calls || !calls.length) return '';
  return `<details class="ai-calls disclosure"><summary>AI calls <span class="count">${calls.length}</span></summary>
    <div class="ai-calls-body">${renderAiCallEntries(calls, turnNumber)}</div></details>`;
}

function _chipOutcomeClass(outcome) {
  if (outcome === 'actor_succeeds' || outcome === 'actor_dominates') return 'dice-actor-win';
  if (outcome === 'target_resists' || outcome === 'target_dominates') return 'dice-target-win';
  return '';

function _diceContestChip(ev) {
  const p = ev.payload || {};
  const tooltip = `actor ${p.actor_roll ?? '?'}+${p.actor_bonus ?? 0} vs target ${p.target_roll ?? '?'}+${p.target_bonus ?? 0} (${p.contest_type || '?'})${p.description ? '\n' + p.description : ''}`;
  const label = p.outcome || 'contest';
  return `<span class="dice-chip ${_chipOutcomeClass(p.outcome)}" title="${escapeHtml(tooltip)}">🎲 ${escapeHtml(label)}</span>`;
}

function _diceAggressionChip(ev) {
  const p = ev.payload || {};
  const cls = p.will_attack ? 'dice-aggr-attack' : 'dice-aggr-calm';
  const tip = `${p.mood || '?'} | d20 ${p.roll ?? '?'} vs threshold ${p.threshold ?? '?'} → ${p.will_attack ? 'attacks' : 'holds'}`;
  return `<span class="dice-chip ${cls}" title="${escapeHtml(tip)}">⚔️ ${escapeHtml(p.mood || 'mood')}${p.will_attack ? ' → attacks' : ''}</span>`;
}

function _diceCombatChip(ev) {
  const p = ev.payload || {};
  const cls = _chipOutcomeClass(p.outcome);
  const tip = `player ${p.player_roll ?? '?'} vs NPC ${p.npc_roll ?? '?'}+${p.npc_bonus ?? 0}${p.description ? '\n' + p.description : ''}`;
  return `<span class="dice-chip ${cls}" title="${escapeHtml(tip)}">🎲 ${escapeHtml(p.outcome || 'combat')}</span>`;
}

function _itemListChips(ev) {
  const expanded = (ev.payload && ev.payload.expanded) || [];
  return expanded.map(it => `<span class="item-chip" title="${escapeHtml(it)}">📦 ${escapeHtml(it.length > 40 ? it.slice(0, 40) + '…' : it)}</span>`).join('');
}

function _itemExamineChip(ev) {
  const p = ev.payload || {};
  const tip = p.description || '';
  return `<span class="item-chip" title="${escapeHtml(tip)}">🔍 ${escapeHtml(p.item_name || 'item')}</span>`;
}

function _objectInteractionChip(ev) {
  const p = ev.payload || {};
  const tip = `${p.narration || ''}${p.delta ? '\n\nΔ ' + p.delta : ''}`;
  return `<span class="object-chip" title="${escapeHtml(tip)}">🛠️ ${escapeHtml(p.object_name || 'object')}</span>`;
}

function renderTurnChips(events, npcsById) {
  if (!events || !events.length) return '';
  const parts = [];
  const seenNpcIds = new Set();
  for (const ev of events) {
    if (ev.event_type === 'dice_contest') parts.push(_diceContestChip(ev));
    else if (ev.event_type === 'dice_aggression') parts.push(_diceAggressionChip(ev));
    else if (ev.event_type === 'dice_combat') parts.push(_diceCombatChip(ev));
    else if (ev.event_type === 'item_list') parts.push(_itemListChips(ev));
    else if (ev.event_type === 'item_examine') parts.push(_itemExamineChip(ev));
    else if (ev.event_type === 'object_interaction') parts.push(_objectInteractionChip(ev));
    if (ev.npc_id && !seenNpcIds.has(ev.npc_id)) {
      seenNpcIds.add(ev.npc_id);
      const npc = npcsById && npcsById[ev.npc_id];
      const name = (npc && npc.name) || ev.npc_id.slice(0, 8);
      parts.push(`<span class="npc-tag" onclick="viewNPC('${ev.npc_id}')">${escapeHtml(name)}</span>`);
    }
  }
  const html = parts.filter(Boolean).join('');
  return html ? `<div class="turn-chips">${html}</div>` : '';
}

function _sceneInfoGroup(label, headers, rows) {
  return `<details class="disclosure"><summary>${label} <span class="count">${rows.length}</span></summary>
