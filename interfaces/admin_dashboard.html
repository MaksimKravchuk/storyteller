<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storyteller Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; display: flex; height: 100vh; }
  a { color: #7c83ff; }
  .sidebar { width: 340px; background: #16213e; border-right: 1px solid #0f3460; overflow-y: auto; flex-shrink: 0; }
  .sidebar h2 { padding: 16px; font-size: 18px; border-bottom: 1px solid #0f3460; color: #e94560; }
  .sidebar-search-wrap { padding: 10px 12px; border-bottom: 1px solid #0f3460; }
  .sidebar-search { width: 100%; padding: 8px 10px; background: #0f1a30; color: #e0e0e0; border: 1px solid #0f3460; border-radius: 4px; font-size: 13px; }
  .sidebar-search:focus { outline: none; border-color: #7c83ff; }
  .session-id-short { color: #7c83ff; font-family: monospace; font-size: 11px; }
  .session-item { padding: 12px 16px; border-bottom: 1px solid #0f3460; cursor: pointer; transition: background 0.15s; }
  .session-item:hover { background: #0f3460; }
  .session-item.active { background: #0f3460; border-left: 3px solid #e94560; }
  .session-item .chat-id { font-weight: 600; color: #fff; }
  .session-item .meta { font-size: 12px; color: #999; margin-top: 4px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-playing { background: #1b5e20; color: #81c784; }
  .badge-idle { background: #424242; color: #bbb; }
  .badge-awaiting { background: #e65100; color: #ffcc80; }
  .badge-green { background: #1b5e20; color: #81c784; }
  .badge-red { background: #5e1b1b; color: #ff8a80; }
  .sidebar-nav { display: flex; border-bottom: 1px solid #0f3460; }
  .sidebar-nav .nav-link { flex: 1; padding: 10px 12px; text-align: center; cursor: pointer; color: #999; font-size: 13px; transition: all 0.15s; }
  .sidebar-nav .nav-link:hover { color: #fff; background: #0f3460; }
  .sidebar-nav .nav-link.active { color: #e94560; border-bottom: 2px solid #e94560; margin-bottom: -1px; }
  .settings-role { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #0f3460; }
  .settings-role:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .settings-role h4 { color: #e94560; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .settings-role .current { font-size: 12px; color: #999; margin-bottom: 8px; }
  .settings-role .current code { color: #e0e0e0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .settings-row { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .settings-row select, .settings-row input { padding: 6px 10px; background: #0f1a30; color: #e0e0e0; border: 1px solid #0f3460; border-radius: 4px; font-size: 13px; }
  .settings-row select { min-width: 120px; }
  .settings-row select.settings-model-sel { min-width: 200px; flex: 1; }
  .settings-row input { min-width: 220px; flex: 1; }
  .settings-row button { padding: 6px 14px; background: #e94560; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .settings-row button:hover { background: #c13651; }
  .settings-banner { margin-top: 6px; padding: 6px 10px; border-radius: 4px; font-size: 12px; }
  .settings-banner.ok { background: #1b5e20; color: #81c784; }
  .settings-banner.err { background: #5e1b1b; color: #ff8a80; }
  .main { flex: 1; overflow-y: auto; padding: 24px; }
  .placeholder { color: #666; font-size: 18px; margin-top: 40vh; text-align: center; }
  .tabs { display: flex; gap: 0; border-bottom: 2px solid #0f3460; margin-bottom: 16px; }
  .tab { padding: 8px 20px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; color: #999; transition: all 0.15s; }
  .tab:hover { color: #fff; }
  .tab.active { color: #e94560; border-bottom-color: #e94560; }
  .card { background: #16213e; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card h3 { color: #e94560; margin-bottom: 12px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 14px; }
  .kv .label { color: #999; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px; color: #999; border-bottom: 1px solid #0f3460; }
  td { padding: 8px; border-bottom: 1px solid #0f3460; }
  .log-entry { background: #16213e; border-radius: 6px; padding: 12px; margin-bottom: 8px; }
  .log-entry .action { color: #7c83ff; font-weight: 600; }
  .log-entry .response { margin-top: 6px; white-space: pre-wrap; font-size: 13px; color: #ccc; }
  .log-entry .turn-info { font-size: 11px; color: #666; margin-bottom: 4px; }
  .empty { color: #666; font-style: italic; padding: 16px; }
  .session-inline-logs { display: grid; gap: 8px; }
  .user-log-group { background: #0f1a30; border: 1px solid #0f3460; border-radius: 6px; padding: 8px; }
  .user-log-group summary { cursor: pointer; color: #7c83ff; font-size: 12px; font-weight: 600; }
  .user-log-entry { background: #0a0f1e; color: #aaa; border-radius: 4px; margin-top: 8px; padding: 8px; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto; font-size: 11px; }

  /* AI Call Logs */
  .ai-calls-toggle { margin-top: 8px; cursor: pointer; font-size: 12px; color: #7c83ff; user-select: none; }
  .ai-calls-toggle:hover { color: #aab0ff; }
  .ai-calls-container { display: none; margin-top: 8px; padding-left: 12px; border-left: 2px solid #0f3460; }
  .ai-calls-container.open { display: block; }
  .ai-call-entry { background: #111a30; border-radius: 4px; padding: 10px; margin-bottom: 6px; font-size: 12px; }
  .ai-call-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .agent-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .agent-Director { background: #4a1525; color: #e94560; }
  .agent-Narrator { background: #152545; color: #5b9bd5; }
  .agent-SceneBuilder { background: #153525; color: #5bd58a; }
  .agent-Actor { background: #2d1545; color: #b57cff; }
  .agent-NPCGenerator { background: #453015; color: #ffb347; }
  .agent-DataMiner { background: #154540; color: #5bd5c8; }
  .agent-MemoryManager { background: #3d3515; color: #d5c85b; }
  .ai-call-meta { color: #666; font-size: 11px; }
  .ai-call-detail-toggle { cursor: pointer; color: #7c83ff; font-size: 11px; margin-top: 4px; user-select: none; }
  .ai-call-detail-toggle:hover { color: #aab0ff; }
  .ai-call-copy-bar { display: flex; gap: 6px; margin-bottom: 6px; }
  .copy-btn { background: #0f3460; color: #7c83ff; border: 1px solid #1a4a7a; border-radius: 4px; padding: 3px 8px; font-size: 10px; cursor: pointer; font-family: inherit; }
  .copy-btn:hover { background: #16467a; color: #aab0ff; }
  .ai-call-detail { display: none; margin-top: 6px; }
  .ai-call-detail.open { display: block; }
  .ai-call-detail pre { background: #0a0f1e; border-radius: 4px; padding: 8px; font-size: 11px; color: #aaa; overflow-x: auto; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; }
  .ai-call-detail h4 { color: #999; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin: 6px 0 4px; }
  .setup-header { color: #999; font-size: 13px; font-weight: 600; margin-bottom: 8px; padding: 6px 0; border-bottom: 1px solid #0f3460; }

  /* Call chain tree */
  .ai-call-tree-root { margin-bottom: 4px; }
  .ai-call-tree-children { margin-left: 20px; border-left: 2px solid #0f3460; padding-left: 12px; }
  .ai-call-tree-child { position: relative; }
  .ai-call-tree-child::before { content: ''; position: absolute; left: -14px; top: 14px; width: 12px; height: 0; border-top: 2px solid #0f3460; }
  .call-seq-badge { display: inline-block; background: #0f3460; color: #7c83ff; font-size: 10px; padding: 1px 5px; border-radius: 8px; margin-right: 4px; }

  /* Scene view */
  .scene-block { background: #0f1a30; border: 1px solid #0f3460; border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
  .scene-header { background: #16213e; padding: 14px 16px; cursor: pointer; user-select: none; border-bottom: 1px solid #0f3460; }
  .scene-header:hover { background: #1a2848; }
  .scene-title { font-size: 15px; font-weight: 600; color: #e94560; }
  .scene-meta { font-size: 12px; color: #999; margin-top: 4px; }
  .scene-body { padding: 12px 16px; }
  .scene-body.collapsed { display: none; }
  .scene-info { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #0f3460; }
  .scene-info-group { margin-bottom: 8px; }
  .scene-info-toggle { cursor: pointer; user-select: none; color: #999; font-size: 12px; margin-bottom: 6px; }
  .scene-info-toggle:hover { color: #ccc; }
  .scene-info-toggle .count-badge { display: inline-block; background: #0f3460; color: #7c83ff; padding: 1px 6px; border-radius: 8px; font-size: 10px; margin-left: 4px; }
  .scene-info-table { display: none; width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
  .scene-info-table.open { display: table; }
  .scene-info-table th { text-align: left; padding: 4px 8px; color: #666; border-bottom: 1px solid #0f3460; font-size: 11px; }
  .scene-info-table td { padding: 4px 8px; border-bottom: 1px solid #0a1025; }
  .npc-tag { display: inline-block; background: #2d1545; color: #b57cff; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin: 2px 2px; cursor: pointer; }
  .npc-tag:hover { background: #3d2055; }
  .poi-tag { display: inline-block; background: #153525; color: #5bd58a; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin: 2px 2px; }
  .scene-desc { font-size: 12px; color: #888; margin-bottom: 12px; font-style: italic; }
  .scene-turns { padding-top: 4px; }

  /* Structured LLM messages */
  .msg-block { margin: 6px 0; border-left: 3px solid #0f3460; padding: 6px 10px; background: #0a0f1e; border-radius: 0 4px 4px 0; }
  .msg-system { border-left-color: #d5c85b; }
  .msg-user { border-left-color: #5bd58a; }
  .msg-assistant { border-left-color: #b57cff; }
  .msg-tool { border-left-color: #5bd5c8; }
  .msg-role-badge { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; color: #999; }
  .msg-system .msg-role-badge { color: #d5c85b; }
  .msg-user .msg-role-badge { color: #5bd58a; }
  .msg-assistant .msg-role-badge { color: #b57cff; }
  .msg-tool .msg-role-badge { color: #5bd5c8; }
  .msg-block pre { background: transparent; padding: 0; color: #ddd; font-size: 12px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* JSON tree */
  .json-tree { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; color: #ddd; }
  .json-tree details { padding-left: 14px; }
  .json-tree details > summary { cursor: pointer; list-style: none; margin-left: -14px; }
  .json-tree details > summary::-webkit-details-marker { display: none; }
  .json-tree details > summary::before { content: '▸ '; color: #666; }
  .json-tree details[open] > summary::before { content: '▾ '; }
  .json-key { color: #7c83ff; }
  .json-str { color: #5bd58a; }
  .json-num { color: #ffb347; }
  .json-bool { color: #e94560; }
  .json-null { color: #888; font-style: italic; }
  .json-punct { color: #666; }

  /* Per-turn chips */
  .turn-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .dice-chip { display: inline-block; background: #1a2848; color: #7c83ff; padding: 3px 10px; border-radius: 12px; font-size: 11px; border: 1px solid #0f3460; cursor: help; }
  .dice-chip.dice-actor-win { background: #153525; color: #5bd58a; }
  .dice-chip.dice-target-win { background: #4a1525; color: #e94560; }
  .dice-chip.dice-aggr-attack { background: #4a1525; color: #e94560; }
  .dice-chip.dice-aggr-calm { background: #2d3015; color: #d5c85b; }
  .item-chip { display: inline-block; background: #453015; color: #ffb347; padding: 3px 10px; border-radius: 12px; font-size: 11px; border: 1px solid #5a3a15; cursor: help; }
  .object-chip { display: inline-block; background: #154540; color: #5bd5c8; padding: 3px 10px; border-radius: 12px; font-size: 11px; border: 1px solid #1a5a54; cursor: help; }

  /* NPC detail page */
  .back-button { background: #0f3460; color: #7c83ff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; margin-right: 12px; }
  .back-button:hover { background: #16478b; }
  .npc-detail-header { display: flex; align-items: center; margin-bottom: 16px; }
  .npc-detail-header h2 { color: #e94560; }
  .subtabs { display: flex; gap: 0; border-bottom: 2px solid #0f3460; margin-bottom: 16px; }
  .subtab { padding: 6px 16px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; color: #999; transition: all 0.15s; font-size: 13px; }
  .subtab:hover { color: #fff; }
  .subtab.active { color: #e94560; border-bottom-color: #e94560; }
  .traits-chip { display: inline-block; background: #2d1545; color: #b57cff; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin: 2px; }
  .inv-chip { display: inline-block; background: #453015; color: #ffb347; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin: 2px; }
  .view-link { color: #7c83ff; cursor: pointer; text-decoration: underline; }
  .view-link:hover { color: #aab0ff; }
  .token-wrap { padding: 10px 12px; border-bottom: 1px solid #0f3460; font-size: 12px; }
  .token-wrap label { display: block; color: #999; margin-bottom: 5px; }
  .token-wrap input { width: 100%; padding: 7px 9px; background: #0f1a30; color: #e0e0e0; border: 1px solid #0f3460; border-radius: 4px; font-size: 12px; }
  .token-help { color: #999; margin: 8px 0; line-height: 1.35; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>Storyteller</h2>
  <div class="token-wrap">
    <label for="admin-token-input">Admin API token</label>
    <input id="admin-token-input" type="password" placeholder="Bearer token" oninput="saveAdminToken(this.value)">
    <div class="token-help">Saved locally. Leave blank when ADMIN_TOKEN is not configured.</div>
  </div>
  <div class="sidebar-nav">
    <div id="nav-sessions" class="nav-link active" onclick="showView('sessions')">Sessions</div>
    <div id="nav-users" class="nav-link" onclick="showView('users')">Users</div>
    <div id="nav-feedback" class="nav-link" onclick="showView('feedback')">Feedback</div>
    <div id="nav-reliability" class="nav-link" onclick="showView('reliability')">Reliability</div>
    <div id="nav-settings" class="nav-link" onclick="showView('settings')">Settings</div>
  </div>
  <div id="sessions-nav-content">
    <div class="sidebar-search-wrap">
      <input id="session-search" class="sidebar-search" type="text"
             placeholder="Search id / player…" oninput="onSearchInput()">
    </div>
    <div id="session-list"></div>
  </div>
  <div id="users-nav-content" style="display:none">
    <div class="sidebar-search-wrap">
      <input id="user-search" class="sidebar-search" type="text"
             placeholder="Search by email…" oninput="onUserSearchInput()">
    </div>
    <div class="sidebar-search-wrap"><button class="copy-btn" onclick="currentUserId=null; loadUsers(); renderUsersHome()">Manage beta invites</button></div>
    <div id="user-list"></div>
  </div>
</div>

<div class="main" id="main">
  <div class="placeholder">Select a session to inspect</div>
</div>

<script>
const API = '';
let _settingsCatalog = [];
let _settingsKeys = {};
let currentSessionId = null;
let currentUserId = null;
let currentTab = 'overview';
let currentNpcId = null;
let currentNpcTab = 'state';
let searchDebounceTimer = null;
let userSearchDebounceTimer = null;
const SEARCH_DEBOUNCE_MS = 250;
const ADMIN_TOKEN_KEY = 'storyteller.adminToken';

function getAdminToken() {
  return localStorage.getItem(ADMIN_TOKEN_KEY) || '';
}

function saveAdminToken(token) {
  const value = (token || '').trim();
  if (value) localStorage.setItem(ADMIN_TOKEN_KEY, value);
  else localStorage.removeItem(ADMIN_TOKEN_KEY);
}

function authHeaders(extra) {
  const headers = Object.assign({}, extra || {});
  const token = getAdminToken();
  if (token) headers.Authorization = 'Bearer ' + token;
  return headers;
}

function currentSearchTerm() {
  const el = document.getElementById('session-search');
  return el ? el.value.trim() : '';
}

function onSearchInput() {
  if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => loadSessions(currentSearchTerm()), SEARCH_DEBOUNCE_MS);
}

function currentUserSearchTerm() {
  const el = document.getElementById('user-search');
  return el ? el.value.trim() : '';
}

function onUserSearchInput() {
  if (userSearchDebounceTimer) clearTimeout(userSearchDebounceTimer);
  userSearchDebounceTimer = setTimeout(() => loadUsers(), SEARCH_DEBOUNCE_MS);
}

function badgeClass(state) {
  if (state === 'playing') return 'badge-playing';
  if (state === 'idle') return 'badge-idle';
  return 'badge-awaiting';
}

async function fetchJSON(url, options) {
  const opts = Object.assign({}, options || {});
  opts.headers = authHeaders(opts.headers);
  const res = await fetch(API + url, opts);
  const data = await res.json();
  if (res.status === 401) {
    const token = prompt('Admin token required. Paste ADMIN_TOKEN:');
    if (token) {
      saveAdminToken(token);
      opts.headers = authHeaders(options?.headers);
      const retry = await fetch(API + url, opts);
      const retryData = await retry.json();
      if (!retry.ok) throw new Error(retryData.error || `HTTP ${retry.status}`);
      return retryData;
    }
  }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function loadSessions(search) {
  const term = (search ?? currentSearchTerm()).trim();
  const qs = term ? '?search=' + encodeURIComponent(term) : '';
  const data = await fetchJSON('/api/sessions' + qs);
  const list = document.getElementById('session-list');
  list.innerHTML = data.sessions.map(s => {
    const chatLabel = s.telegram_chat_id != null ? 'Chat ' + s.telegram_chat_id : 'Web';
    const idShort = (s.id || '').slice(0, 8);
    return `
    <div class="session-item ${s.id === currentSessionId ? 'active' : ''}" onclick="selectSession('${s.id}')">
      <div class="chat-id">${chatLabel} <span class="badge ${badgeClass(s.state)}">${s.state}</span></div>
      <div class="meta"><span class="session-id-short">${idShort}</span> | ${renderOwnerLabel(s)}</div>
      <div class="meta">${s.language} | Turn ${s.turn_count ?? 0} | ${s.game_time ?? '-'}</div>
    </div>`;
  }).join('');
}

function renderOwnerLabel(s) {
  if (s.account_email && s.account_id) {
    return `<span class="view-link" onclick="event.stopPropagation(); openUserFromCrossLink('${s.account_id}')">${escapeHtml(s.account_email)}</span>`;
  }
  if (s.telegram_chat_id != null && !s.web_player_id) return 'Chat ' + s.telegram_chat_id;
  return '—';
}

async function openUserFromCrossLink(accountId) {
  currentUserId = accountId;
  showView('users');
}

async function selectSession(id) {
  currentSessionId = id;
  loadSessions();
  renderTab();
}

async function loadUsers() {
  const term = currentUserSearchTerm();
  const qs = term ? '?email_query=' + encodeURIComponent(term) : '';
  const data = await fetchJSON('/api/admin/users' + qs);
  const list = document.getElementById('user-list');
  const users = data.users || [];
  if (!users.length) {
    list.innerHTML = '<div class="empty">No users</div>';
    return;
  }
  list.innerHTML = users.map(u => {
    const id = String(u.id || '');
    const idShort = id.slice(0, 8);
    const email = escapeHtml(u.email || idShort || 'Unknown user');
    const sessions = u.session_count ?? 0;
    const calls = u.call_count ?? 0;
    const tokens = u.total_tokens ?? 0;
    return `
    <div class="session-item ${id === currentUserId ? 'active' : ''}" onclick="selectUser('${id}')">
      <div class="chat-id">${email} ${u.is_admin ? '<span class="badge badge-playing">admin</span>' : ''}</div>
      <div class="meta"><span class="session-id-short">${escapeHtml(idShort)}</span> | ${escapeHtml(u.plan || '-')}</div>
      <div class="meta">${sessions} sessions | ${calls} calls | ${tokens} tokens</div>
    </div>`;
  }).join('');
}

async function selectUser(id) {
  currentUserId = id;
  await loadUsers();
  await renderUserDetail();
}

async function openUserSession(id) {
  currentSessionId = id;
  currentTab = 'scenes';
  showView('sessions');
  await loadSessions();
  await renderTab();
}

async function renderUserDetail() {
  if (!currentUserId) return;
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">Loading user…</div>';
  try {
    const data = await fetchJSON(`/api/admin/users/${currentUserId}`);
    const account = data.account || {};
    const usage = data.usage || {};
    const sessions = data.sessions || [];
    const invites = data.invites || [];
    const feedback = data.feedback || [];
    main.innerHTML = `<div class="card"><h3>User</h3><div class="kv">
      <div class="label">Email</div><div>${escapeHtml(account.email || '')}</div>
      <div class="label">Account ID</div><div><code>${escapeHtml(account.id || '')}</code></div>

function renderMessages(messages) {

    return '<div class="empty">No messages</div>';
  }
  return messages.map(m => {
    const role = (m.role || 'user').toString();
    const content = typeof m.content === 'string' ? m.content : JSON.stringify(m.content, null, 2);

function renderResponse(text) {
  const raw = text || '';
  try {
    const parsed = JSON.parse(raw);
    if (parsed !== null && typeof parsed === 'object') {
      return `<div class="json-tree">${renderJsonTree(parsed, 0)}</div>`;
    }
  } catch (e) {
    // not JSON — fall through to plain rendering
  }
  return `<pre style="background:#0a0f1e;padding:8px;border-radius:4px;font-size:12px;color:#ddd;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto">${escapeHtml(raw)}</pre>`;
}

const _JSON_MAX_DEPTH = 6;

function renderJsonLeaf(val) {
  if (val === null) return '<span class="json-null">null</span>';
  if (typeof val === 'boolean') return `<span class="json-bool">${val}</span>`;
  if (typeof val === 'number') return `<span class="json-num">${val}</span>`;
  if (typeof val === 'string') return `<span class="json-str">${escapeHtml(JSON.stringify(val))}</span>`;
  return `<span class="json-str">${escapeHtml(String(val))}</span>`;
}

function renderJsonTree(obj, depth) {
  if (depth > _JSON_MAX_DEPTH) return '<span class="json-null">…</span>';
  if (obj === null || typeof obj !== 'object') return renderJsonLeaf(obj);
  if (Array.isArray(obj)) {
    if (!obj.length) return '<span class="json-punct">[]</span>';
    const items = obj.map((v, i) => `<div>${renderJsonTree(v, depth + 1)}${i < obj.length - 1 ? '<span class="json-punct">,</span>' : ''}</div>`).join('');
    return `<details open><summary><span class="json-punct">[</span> <span class="json-num">${obj.length}</span> <span class="json-punct">]</span></summary>${items}</details>`;
  }
  const keys = Object.keys(obj);
  if (!keys.length) return '<span class="json-punct">{}</span>';
  const items = keys.map((k, i) => `<div><span class="json-key">${escapeHtml(JSON.stringify(k))}</span><span class="json-punct">: </span>${renderJsonTree(obj[k], depth + 1)}${i < keys.length - 1 ? '<span class="json-punct">,</span>' : ''}</div>`).join('');
  return `<details open><summary><span class="json-punct">{</span> <span class="json-num">${keys.length}</span> <span class="json-punct">}</span></summary>${items}</details>`;
}

window.__aiCallCache = window.__aiCallCache || {};

function copyCallPrompt(uid, kind, btn) {
  const c = window.__aiCallCache[uid];
  if (!c) return;
  let text;
  if (kind === 'system') {
    text = c.system_prompt || '';
  } else {
    text = JSON.stringify({ system: c.system_prompt || '', messages: c.messages || [] }, null, 2);
  }
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1200);
  });
}

function renderSingleCall(c, turnNumber) {
  const tokens = [c.prompt_tokens, c.completion_tokens].filter(x => x != null);
  const tokenStr = tokens.length ? tokens.join('+') + ' tok' : '';
  const durStr = c.duration_ms != null ? c.duration_ms + 'ms' : '';
  const metaParts = [c.model, tokenStr, durStr].filter(Boolean).join(' | ');
  const uid = 'aic-' + Math.random().toString(36).slice(2, 10);
  window.__aiCallCache[uid] = { system_prompt: c.system_prompt, messages: c.messages };
  const seqBadge = c.call_sequence != null ? `<span class="call-seq-badge">${turnNumber != null ? turnNumber + '.' + c.call_sequence : '#' + c.call_sequence}</span>` : '';
  return `
    <div class="ai-call-entry">
      <div class="ai-call-header">
        ${seqBadge}
        <span class="agent-badge agent-${c.agent_name}">${c.agent_name}</span>
        <span class="ai-call-meta">${metaParts}</span>
      </div>
      <div class="ai-call-detail-toggle" onclick="toggleDetail('${uid}')">Show prompt &amp; response</div>
      <div class="ai-call-detail" id="${uid}">
        <div class="ai-call-copy-bar">
          <button type="button" class="copy-btn" onclick="copyCallPrompt('${uid}', 'system', this)">Copy system</button>
          <button type="button" class="copy-btn" onclick="copyCallPrompt('${uid}', 'full', this)">Copy full prompt (JSON)</button>
        </div>
        ${renderSystemPrompt(c.system_prompt)}
        <h4>Messages Sent</h4>
        ${renderMessages(c.messages)}
        <h4>Response</h4>
        ${renderResponse(c.response_content)}
      </div>
    </div>`;
}

function renderAiCallEntries(calls, turnNumber) {
  if (!calls || !calls.length) return '';

  // Sort by call_sequence (fallback to original order)
  const sorted = [...calls].sort((a, b) =>
    (a.call_sequence ?? 0) - (b.call_sequence ?? 0)
  );

  // Build tree: root nodes (parent_agent=null), children grouped under parent
  const roots = [];
  for (const call of sorted) {
    if (!call.parent_agent) {
      roots.push({ call, children: [] });
    } else {
      // Attach to most recent root from the parent agent
      let attached = false;
      for (let i = roots.length - 1; i >= 0; i--) {
        if (roots[i].call.agent_name === call.parent_agent) {
          roots[i].children.push(call);
          attached = true;
          break;
        }
      }
      if (!attached) roots.push({ call, children: [] });
    }
  }

  return roots.map(node => {
    const rootHtml = renderSingleCall(node.call, turnNumber);
    if (!node.children.length) return rootHtml;
    const childHtml = node.children
      .map(c => `<div class="ai-call-tree-child">${renderSingleCall(c, turnNumber)}</div>`)
      .join('');
    return `
      <div class="ai-call-tree-root">
        ${rootHtml}
        <div class="ai-call-tree-children">${childHtml}</div>
      </div>`;
  }).join('');
}

function _chipOutcomeClass(outcome) {
  if (outcome === 'actor_succeeds' || outcome === 'actor_dominates') return 'dice-actor-win';
  if (outcome === 'target_resists' || outcome === 'target_dominates') return 'dice-target-win';
  return '';
}

  const p = ev.payload || {};
  const tooltip = `actor ${p.actor_roll ?? '?'}+${p.actor_bonus ?? 0} vs target ${p.target_roll ?? '?'}+${p.target_bonus ?? 0} (${p.contest_type || '?'})${p.description ? '\n' + p.description : ''}`;
  const label = p.outcome || 'contest';
  return `<span class="dice-chip ${_chipOutcomeClass(p.outcome)}" title="${escapeHtml(tooltip)}">🎲 ${escapeHtml(label)}</span>`;
}

function _diceAggressionChip(ev) {
  const p = ev.payload || {};
  const cls = p.will_attack ? 'dice-aggr-attack' : 'dice-aggr-calm';
  const tip = `${p.mood || '?'} | d20 ${p.roll ?? '?'} vs threshold ${p.threshold ?? '?'} → ${p.will_attack ? 'attacks' : 'holds'}`;
  return `<span class="dice-chip ${cls}" title="${escapeHtml(tip)}">⚔️ ${escapeHtml(p.mood || 'mood')}${p.will_attack ? ' → attacks' : ''}</span>`;
}

function _diceCombatChip(ev) {
  const p = ev.payload || {};
  const cls = _chipOutcomeClass(p.outcome);
  const tip = `player ${p.player_roll ?? '?'} vs NPC ${p.npc_roll ?? '?'}+${p.npc_bonus ?? 0}${p.description ? '\n' + p.description : ''}`;
  return `<span class="dice-chip ${cls}" title="${escapeHtml(tip)}">🎲 ${escapeHtml(p.outcome || 'combat')}</span>`;
}

function _itemListChips(ev) {
  const expanded = (ev.payload && ev.payload.expanded) || [];
  return expanded.map(it => `<span class="item-chip" title="${escapeHtml(it)}">📦 ${escapeHtml(it.length > 40 ? it.slice(0, 40) + '…' : it)}</span>`).join('');
}

function _itemExamineChip(ev) {
  const p = ev.payload || {};
  const tip = p.description || '';
  return `<span class="item-chip" title="${escapeHtml(tip)}">🔍 ${escapeHtml(p.item_name || 'item')}</span>`;
}

function _objectInteractionChip(ev) {
  const p = ev.payload || {};
  const tip = `${p.narration || ''}${p.delta ? '\n\nΔ ' + p.delta : ''}`;
  return `<span class="object-chip" title="${escapeHtml(tip)}">🛠️ ${escapeHtml(p.object_name || 'object')}</span>`;
}

function renderTurnChips(events, npcsById) {
  if (!events || !events.length) return '';
  const parts = [];
  const seenNpcIds = new Set();
  for (const ev of events) {
    if (ev.event_type === 'dice_contest') parts.push(_diceContestChip(ev));
    else if (ev.event_type === 'dice_aggression') parts.push(_diceAggressionChip(ev));
    else if (ev.event_type === 'dice_combat') parts.push(_diceCombatChip(ev));
    else if (ev.event_type === 'item_list') parts.push(_itemListChips(ev));
    else if (ev.event_type === 'item_examine') parts.push(_itemExamineChip(ev));
    else if (ev.event_type === 'object_interaction') parts.push(_objectInteractionChip(ev));
    if (ev.npc_id && !seenNpcIds.has(ev.npc_id)) {
      seenNpcIds.add(ev.npc_id);
      const npc = npcsById && npcsById[ev.npc_id];
      const name = npc ? npc.name : ev.npc_id.slice(0, 8);
      parts.push(`<span class="npc-tag" onclick="viewNPC('${ev.npc_id}')">${escapeHtml(name)}</span>`);
    }
  }
  const html = parts.filter(Boolean).join('');
  return html ? `<div class="turn-chips">${html}</div>` : '';
}

async function renderScenes(el) {
  const [convData, scenesData, aiData, eventsData, npcsData] = await Promise.all([
    fetchJSON(`/api/sessions/${currentSessionId}/conversation`),
    fetchJSON(`/api/sessions/${currentSessionId}/scenes`),
    fetchJSON(`/api/sessions/${currentSessionId}/ai-calls`),
    fetchJSON(`/api/sessions/${currentSessionId}/turn-events`),
    fetchJSON(`/api/sessions/${currentSessionId}/npcs`),
  ]);

  const aiCalls = aiData.ai_calls || [];
  const callsByTurn = {};
  for (const call of aiCalls) {
    const key = call.turn_number != null ? call.turn_number : 'setup';
    (callsByTurn[key] = callsByTurn[key] || []).push(call);
  }

  const eventsByTurn = {};
  for (const ev of (eventsData.turn_events || [])) {
    if (ev.turn_number == null) continue;
    (eventsByTurn[ev.turn_number] = eventsByTurn[ev.turn_number] || []).push(ev);
  }

  const npcsById = {};
  for (const n of (npcsData.npcs || [])) npcsById[n.id] = n;

  // Index scenes by scene_number
  const scenesByNum = {};
  for (const s of (scenesData.scenes || [])) {
    scenesByNum[s.scene_number] = s;
  }

  // Group conversation entries by scene_number (fallback 0 for old entries)
  const turnsByScene = {};
  for (const entry of (convData.log || [])) {
    const sn = entry.scene_number != null ? entry.scene_number : 0;
    (turnsByScene[sn] = turnsByScene[sn] || []).push(entry);
  }

  // Collect all scene numbers and sort
  const allSceneNums = [...new Set([
    ...Object.keys(scenesByNum).map(Number),
    ...Object.keys(turnsByScene).map(Number),
  ])].sort((a, b) => a - b);

  if (!allSceneNums.length && !aiCalls.length) {
    el.innerHTML = '<div class="empty">No scenes yet</div>';
    return;
  }

  let html = '';

  // Setup calls (turn_number = null) — before any scene
  if (callsByTurn['setup'] && callsByTurn['setup'].length) {
    const sid = 'ai-setup-' + Math.random().toString(36).slice(2, 10);
    html += `
      <div class="log-entry">
        <div class="setup-header">Game Setup</div>
        <div class="ai-calls-toggle" onclick="toggleAiCalls('${sid}')">
          AI Calls (${callsByTurn['setup'].length})
        </div>
        <div class="ai-calls-container" id="${sid}">
          ${renderAiCallEntries(callsByTurn['setup'])}
        </div>
      </div>`;
  }

  for (const sn of allSceneNums) {
    const scene = scenesByNum[sn];
    const turns = turnsByScene[sn] || [];
    const bodyId = 'scene-body-' + sn;
    const isCurrent = scene && scene.is_current;
    const turnCount = turns.length;

    // Scene header info
    let locDesc = 'Unknown location';
    let timeOfDay = '';
    if (scene) {
      locDesc = scene.description ? scene.description.substring(0, 120) : (scene.location_id || 'Unknown');
      if (scene.description && scene.description.length > 120) locDesc += '...';
      timeOfDay = scene.time_of_day || '';
    }

    // NPC table
    const npcs = (scene && scene.npcs_present) || [];
    const pois = (scene && scene.points_of_interest) || [];

    let infoHtml = '';
    if (npcs.length || pois.length) {
      infoHtml = '<div class="scene-info">';

      if (npcs.length) {
        const npcTableId = 'npc-tbl-' + sn;
        const npcRows = npcs.map((npc, i) => {
          const role = typeof npc === 'object' ? (npc.role || '-') : npc;
          const uuid = typeof npc === 'object' ? (npc.uuid || '-') : '-';
          return `<tr><td>${i + 1}</td><td>${escapeHtml(role)}</td><td style="color:#666">${escapeHtml(uuid)}</td></tr>`;
        }).join('');
        infoHtml += `<div class="scene-info-group">
          <div class="scene-info-toggle" onclick="document.getElementById('${npcTableId}').classList.toggle('open')">
            NPCs <span class="count-badge">${npcs.length}</span>
          </div>
          <table class="scene-info-table" id="${npcTableId}">
            <tr><th>#</th><th>Role</th><th>UUID</th></tr>
            ${npcRows}
          </table>
        </div>`;
      }

      if (pois.length) {
        const poiTableId = 'poi-tbl-' + sn;
        const poiRows = pois.map((p, i) => {
          const label = typeof p === 'object'
            ? ((p.names && p.names.join(', ')) || '-')
            : p;
          return `<tr><td>${i + 1}</td><td>${escapeHtml(label)}</td></tr>`;
        }).join('');
        infoHtml += `<div class="scene-info-group">
          <div class="scene-info-toggle" onclick="document.getElementById('${poiTableId}').classList.toggle('open')">
            Points of Interest <span class="count-badge">${pois.length}</span>
          </div>
          <table class="scene-info-table" id="${poiTableId}">
            <tr><th>#</th><th>Name</th></tr>
            ${poiRows}
          </table>
        </div>`;
      }

      infoHtml += '</div>';
    }

    // Scene description
    let descHtml = '';
    if (scene && scene.description) {
      descHtml = `<div class="scene-desc">${escapeHtml(scene.description)}</div>`;
    }

    // Turns
    const turnsHtml = turns.map(e => {
      const turnCalls = callsByTurn[e.turn] || [];
      const cid = 'ai-turn-' + e.turn + '-' + Math.random().toString(36).slice(2, 10);
      const aiSection = turnCalls.length ? `
        <div class="ai-calls-toggle" onclick="toggleAiCalls('${cid}')">
          AI Calls (${turnCalls.length})
        </div>
        <div class="ai-calls-container" id="${cid}">
          ${renderAiCallEntries(turnCalls, e.turn)}
        </div>` : '';
      const chips = renderTurnChips(eventsByTurn[e.turn], npcsById);
      return `
        <div class="log-entry">
          <div class="turn-info">Turn ${e.turn} | ${e.game_clock?.toFixed(1) ?? '?'}h</div>
          <div class="action">&gt; ${escapeHtml(e.player_action)}</div>
          <div class="response">${escapeHtml(e.response)}</div>
          ${chips}
          ${aiSection}
        </div>`;
    }).join('');

    html += `
      <div class="scene-block">
        <div class="scene-header" onclick="toggleScene('${bodyId}')">
          <div class="scene-title">Scene ${sn}${isCurrent ? ' (current)' : ''}</div>
          <div class="scene-meta">${escapeHtml(locDesc)}${timeOfDay ? ' | ' + timeOfDay : ''} | ${turnCount} turn${turnCount !== 1 ? 's' : ''}</div>
        </div>
        <div class="scene-body" id="${bodyId}">
          ${!scene ? '<div class="empty">Scene metadata unavailable (pre-migration)</div>' : ''}
          ${infoHtml}
          ${descHtml}
          <div class="scene-turns">${turnsHtml || '<div class="empty">No turns in this scene</div>'}</div>
        </div>
      </div>`;
  }

  el.innerHTML = html;
}

function _renderKvGrid(rows) {
  return `<div class="kv">${rows.map(([label, val]) => `<div class="label">${escapeHtml(label)}</div><div>${val}</div>`).join('')}</div>`;
}

function _renderChipList(items, cls) {
  if (!items || !items.length) return '<span style="color:#666">empty</span>';
  return items.map(it => `<span class="${cls}">${escapeHtml(String(it))}</span>`).join('');
}

function _renderObjectKv(obj) {
  const keys = Object.keys(obj || {});
  if (!keys.length) return '<span style="color:#666">empty</span>';
  return `<div class="kv">${keys.map(k => `<div class="label">${escapeHtml(k)}</div><div>${escapeHtml(String(obj[k]))}</div>`).join('')}</div>`;
}

function renderNpcStateTab(npc) {
  const scalarCard = `<div class="card"><h3>State</h3>${_renderKvGrid([
    ['Name', escapeHtml(npc.name || '')],
    ['Occupation', escapeHtml(npc.occupation || '-')],
    ['Mood', escapeHtml(npc.current_mood || '-')],
    ['Physical Status', escapeHtml(npc.physical_status || 'healthy')],
    ['Location', escapeHtml(npc.location_id || '-')],
    ['Knowledge Scope', escapeHtml(npc.knowledge_scope || '-')],
    ['Speech Style', escapeHtml(npc.speech_style || '-')],
  ])}</div>`;
  const attrsCard = `<div class="card"><h3>Attributes</h3>${_renderObjectKv(npc.attributes)}</div>`;
  const invCard = `<div class="card"><h3>Inventory</h3>${_renderChipList(npc.inventory, 'inv-chip')}</div>`;
  const traitsCard = `<div class="card"><h3>Personality Traits</h3>${_renderChipList(npc.personality_traits, 'traits-chip')}</div>`;

  return scalarCard + attrsCard + invCard + traitsCard + relsCard + bioCard + appCard;

async function renderNpcHistoryTab(npcId) {
  const [eventsData, aiData] = await Promise.all([
    fetchJSON(`/api/sessions/${currentSessionId}/turn-events?npc_id=${encodeURIComponent(npcId)}`),
    fetchJSON(`/api/sessions/${currentSessionId}/ai-calls`),
  ]);
  const events = eventsData.turn_events || [];
  const aiCalls = aiData.ai_calls || [];

  // Group events by turn
  const evByTurn = {};
  for (const ev of events) {
    if (ev.turn_number == null) continue;
    (evByTurn[ev.turn_number] = evByTurn[ev.turn_number] || []).push(ev);
  }

  // Only keep AI calls where the NPC's name appears in response or messages — best-effort
  // Simpler: group calls per turn, so we show all calls for turns where the NPC acted.
  const callsByTurn = {};
  for (const c of aiCalls) {
    const key = c.turn_number != null ? c.turn_number : 'setup';
    (callsByTurn[key] = callsByTurn[key] || []).push(c);
  }

  const turns = Object.keys(evByTurn).map(Number).sort((a, b) => a - b);
  if (!turns.length) return '<div class="empty">No recorded events for this NPC</div>';

  const npcsById = { [npcId]: { name: '' } };
  return turns.map(tn => {
    const chips = renderTurnChips(evByTurn[tn], npcsById);
    const turnCalls = callsByTurn[tn] || [];
    const cid = 'npc-ai-' + tn + '-' + Math.random().toString(36).slice(2, 10);
    const aiSection = turnCalls.length ? `
      <div class="ai-calls-toggle" onclick="toggleAiCalls('${cid}')">
        AI Calls (${turnCalls.length})
      </div>
      <div class="ai-calls-container" id="${cid}">
        ${renderAiCallEntries(turnCalls, tn)}
      </div>` : '';
    return `<div class="log-entry">
      <div class="turn-info">Turn ${tn}</div>
      ${chips}
      ${aiSection}
    </div>`;
  }).join('');
}

function renderNpcMemoryTab(nodes, edges) {
  if (!nodes.length && !edges.length) {
    return '<div class="empty">No memory edges for this NPC</div>';
  }
  const nodesById = {};
  for (const n of nodes) nodesById[n.id] = n;
  const nodesTable = nodes.length ? `<div class="card"><h3>Memory Nodes (${nodes.length})</h3>
    <table><tr><th>Content</th><th>Scope</th><th>Source</th><th>Canon</th><th>Confidence</th><th>Tags</th><th>Time</th></tr>
    ${nodes.map(n => `<tr>
      <td>${escapeHtml((n.content || '').substring(0, 200))}${(n.content || '').length > 200 ? '…' : ''}</td>
      <td>${escapeHtml(n.scope || '')}</td>
      <td>${escapeHtml(n.source || '')}</td>
      <td>${escapeHtml(n.canon || '')}</td>
      <td>${n.confidence ?? '-'}</td>
      <td>${(n.tags || []).map(escapeHtml).join(', ')}</td>
      <td>${n.timestamp ?? '-'}</td>
    </tr>`).join('')}
    </table></div>` : '';
  const edgesTable = edges.length ? `<div class="card"><h3>Edges (${edges.length})</h3>
    <table><tr><th>Type</th><th>→ Target node (snippet)</th></tr>
    ${edges.map(e => {
      const target = nodesById[e.to_node_id];
      const snippet = target ? (target.content || '').substring(0, 120) : e.to_node_id;
      return `<tr><td>${escapeHtml(e.edge_type || '')}</td><td>${escapeHtml(snippet)}${target && (target.content || '').length > 120 ? '…' : ''}</td></tr>`;
    }).join('')}
    </table></div>` : '';
  return nodesTable + edgesTable;
}

async function renderNpcDetail(el) {

  if (data.error) { el.innerHTML = `<div class="empty">${data.error}</div>`; return; }
  const npc = data.npc;

  const subtabs = ['state', 'history', 'memory'];
  const header = `<div class="npc-detail-header">
    <button class="back-button" onclick="backToNpcs()">← NPCs</button>

  </div>
  <div class="subtabs">
    ${subtabs.map(t => `<div class="subtab ${t === currentNpcTab ? 'active' : ''}" onclick="switchNpcTab('${t}')">${t}</div>`).join('')}
  </div>
  <div id="npc-subtab-content"></div>`;

const _RELIABILITY_WINDOWS = ['24h', '7d', '30d'];
let _reliabilityWindow = '24h';

async function renderReliabilityView() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">Loading reliability data…</div>';
  try {
    const data = await fetchJSON('/api/admin/reliability?window=' + _reliabilityWindow);
    main.innerHTML = renderReliabilityHtml(data);
  } catch (e) {
    main.innerHTML = `<div class="empty">Error loading reliability: ${escapeHtml(e.message)}</div>`;
  }
}

function _reliabilityWindowButtons() {
  return _RELIABILITY_WINDOWS.map(w =>
    `<button class="copy-btn${w === _reliabilityWindow ? ' active' : ''}"
             style="${w === _reliabilityWindow ? 'background:#e94560;color:#fff;border-color:#e94560' : ''}"
             onclick="switchReliabilityWindow('${w}')">${w}</button>`
  ).join('');
}

function switchReliabilityWindow(w) {
  _reliabilityWindow = w;
  renderReliabilityView();
}

function _groupReliabilityRows(rows) {
  const byAgent = {};
  for (const row of rows) {
    if (!byAgent[row.agent]) byAgent[row.agent] = {};
    byAgent[row.agent][row.event_type] = row.total;
  }
  return byAgent;
}

function renderReliabilityHtml(data) {
  const rows = data.rows || [];
  const windowLabel = data.window || _reliabilityWindow;
  const windowControls = `<div class="settings-row" style="margin-bottom:14px">${_reliabilityWindowButtons()}</div>`;

  if (!rows.length) {
    return `<div class="card"><h3>Reliability — ${escapeHtml(windowLabel)}</h3>
      ${windowControls}
      <div class="empty">No reliability snapshots in the last ${escapeHtml(windowLabel)}.</div>
    </div>`;
  }

  const eventTypes = [...new Set(rows.map(r => r.event_type))].sort();
  const byAgent = _groupReliabilityRows(rows);
  const agents = Object.keys(byAgent).sort();

  const headerCols = eventTypes.map(et =>
    `<th style="text-align:right">${escapeHtml(et)}</th>`
  ).join('');

  const bodyRows = agents.map(agent => {
    const cells = eventTypes.map(et => {
      const val = byAgent[agent][et] || 0;
      const style = val > 0 ? 'color:#ff8a80;font-weight:600' : 'color:#666';
      return `<td style="text-align:right;${style}">${val}</td>`;
    }).join('');
    return `<tr>
      <td><span class="agent-badge agent-${escapeHtml(agent)}">${escapeHtml(agent)}</span></td>
      ${cells}
    </tr>`;
  }).join('');

  return `<div class="card"><h3>Reliability — ${escapeHtml(windowLabel)}</h3>
    ${windowControls}
    <p class="token-help" style="margin-bottom:12px">
      Per-agent fallback / retry / schema-failure counts summed from
      <code>turn_events.payload</code> reliability snapshots.
      Non-zero cells are highlighted in red.
    </p>
    <table>
      <tr><th>Agent</th>${headerCols}</tr>
      ${bodyRows}
    </table>
  </div>`;
}

function renderSettingsHtml(keys, models) {
  _settingsCatalog = models.catalog || [];
  _settingsKeys = keys || {};

  const keysCard = `<div class="card"><h3>API Keys</h3>
    <div class="kv">
      ${['openai','anthropic','openrouter'].map(p =>
        `<div class="label">${p}</div><div>${keys[p]
          ? '<span class="badge badge-green">Configured</span>'
          : '<span class="badge badge-red">Missing</span>'}</div>`
      ).join('')}
    </div>
  </div>`;

  const roles = models.roles || {};
  const providers = [...new Set(_settingsCatalog.map(m => m.provider))].sort();

  const rolesCard = `<div class="card"><h3>Model Roles</h3>
    ${['director','agent','narrator','dramaturge'].map(role => {
      const current = roles[role] || {provider: '', model_id: '', source: 'default'};
      const currentProvider = providers.includes(current.provider) ? current.provider : '';

      const providerOptions = providers.map(p =>
        `<option value="${escapeHtml(p)}" ${p === currentProvider ? 'selected' : ''}>${escapeHtml(p)}</option>`
      ).join('');

      const modelOptions = _buildModelOptions(currentProvider, current.model_id);

      return `<div class="settings-role" data-role="${role}">
        <h4>${role}</h4>
        <div class="current">Current: <code>${escapeHtml(current.provider || '?')}</code> / <code>${escapeHtml(current.model_id || '?')}</code>
          &nbsp;<span class="badge badge-${current.source === 'db' ? 'playing' : 'idle'}">source: ${escapeHtml(current.source || '?')}</span>
        </div>
        <div class="settings-row">
          <select class="settings-provider-${role}" onchange="onProviderPick('${role}', this.value)">
            <option value="">-- provider --</option>
            ${providerOptions}
          </select>
          <select class="settings-model-sel settings-model-${role}" onchange="onModelPick('${role}', this.value)">
            <option value="">-- model --</option>
            ${modelOptions}
          </select>
        </div>
        <div class="settings-row">
          <input type="text" class="settings-input-${role}"
                 placeholder="or type a custom model_id (e.g. deepseek/deepseek-chat-v3.1)"
                 value="${escapeHtml(current.model_id || '')}">
          <button onclick="saveModel('${role}')">Save</button>
        </div>
        <div class="settings-banner-${role}" style="display:none"></div>
      </div>`;
    }).join('')}
  </div>`;

  return keysCard + rolesCard;
}

function _buildModelOptions(provider, currentModelId) {
  if (!provider) return '';
  const hasKey = !!_settingsKeys[provider];
  return _settingsCatalog
    .filter(m => m.provider === provider)
    .map(m => {
      const sel = m.model_id === currentModelId ? 'selected' : '';
      const dis = hasKey ? '' : 'disabled';
      return `<option value="${escapeHtml(m.model_id)}" ${dis} ${sel}>${escapeHtml(m.model_id)}</option>`;
    }).join('');
}

function detectProviderFromModelId(modelId) {
  const m = (modelId || '').toLowerCase();
  const orPrefixes = ['deepseek/','google/','x-ai/','qwen/','moonshotai/','meta-llama/','mistralai/'];
  if (orPrefixes.some(p => m.startsWith(p))) return 'openrouter';
  if (/^(gpt-|o1|o3|o4)/.test(m)) return 'openai';
  if (m.startsWith('claude')) return 'anthropic';
  return null;
}

function onProviderPick(role, provider) {
  const modelSelect = document.querySelector(`.settings-model-${role}`);
  if (modelSelect) {
    modelSelect.innerHTML = '<option value="">-- model --</option>' + _buildModelOptions(provider, '');
    modelSelect.value = '';
  }
  const input = document.querySelector(`.settings-input-${role}`);
  if (input) input.value = '';
}

function onModelPick(role, modelId) {
  const input = document.querySelector(`.settings-input-${role}`);
  if (input) input.value = modelId;
}

function showBanner(role, message, ok) {
  const banner = document.querySelector(`.settings-banner-${role}`);
  if (!banner) return;
  banner.className = `settings-banner ${ok ? 'ok' : 'err'} settings-banner-${role}`;
  banner.textContent = message;
  banner.style.display = '';
}

async function saveModel(role) {
  const input = document.querySelector(`.settings-input-${role}`);
  const providerSelect = document.querySelector(`.settings-provider-${role}`);
  const modelId = (input?.value || '').trim();
  if (!modelId) {
    showBanner(role, 'model_id is empty', false);
    return;
  }
  let provider = providerSelect?.value || detectProviderFromModelId(modelId);
  if (!provider) {
    showBanner(role, 'could not detect provider from model_id — please pick from catalog', false);
    return;
  }
  try {
    await fetchJSON('/api/settings/models', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({role, provider, model_id: modelId}),
    });
    showBanner(role, `Saved: ${provider} / ${modelId}`, true);
    setTimeout(renderSettingsView, 600);
  } catch (e) {
    showBanner(role, e.message, false);
  }
}

// Auto-refresh session list every 5s (preserving the active search)
const adminTokenInput = document.getElementById('admin-token-input');
if (adminTokenInput) adminTokenInput.value = getAdminToken();
loadSessions();
setInterval(() => { if (currentView === 'sessions') loadSessions(currentSearchTerm()); }, 5000);
</script>
</body>
