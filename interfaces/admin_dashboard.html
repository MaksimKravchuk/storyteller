async function renderScenes(el) {
  const [convData, scenesData, aiData, eventsData, npcsData] = await Promise.all([
    fetchJSON(`/api/sessions/${currentSessionId}/conversation`),
    fetchJSON(`/api/sessions/${currentSessionId}/scenes`),
    fetchJSON(`/api/sessions/${currentSessionId}/ai-calls`),
    fetchJSON(`/api/sessions/${currentSessionId}/turn-events`),
    fetchJSON(`/api/sessions/${currentSessionId}/npcs`),
  ]);

  const aiCalls = aiData.ai_calls || [];
  const callsByTurn = {};
  for (const call of aiCalls) {
    const key = call.turn_number != null ? call.turn_number : 'setup';
    (callsByTurn[key] = callsByTurn[key] || []).push(call);
  }

  const eventsByTurn = {};
  for (const ev of (eventsData.turn_events || [])) {
    if (ev.turn_number == null) continue;
    (eventsByTurn[ev.turn_number] = eventsByTurn[ev.turn_number] || []).push(ev);
  }

  const npcsById = {};
  for (const n of (npcsData.npcs || [])) npcsById[n.id] = n;

  // Index scenes by scene_number
  const scenesByNum = {};
  for (const s of (scenesData.scenes || [])) {
    scenesByNum[s.scene_number] = s;
  }

  // Group conversation entries by scene_number (fallback 0 for old entries)
  const turnsByScene = {};
  for (const entry of (convData.log || [])) {
    const sn = entry.scene_number != null ? entry.scene_number : 0;
    (turnsByScene[sn] = turnsByScene[sn] || []).push(entry);
  }

  // Collect all scene numbers and sort
  const allSceneNums = [...new Set([
    ...Object.keys(scenesByNum).map(Number),
    ...Object.keys(turnsByScene).map(Number),
  ])].sort((a, b) => a - b);

  if (!allSceneNums.length && !aiCalls.length) {
    el.innerHTML = '<div class="empty">No scenes yet</div>';
    return;
  }

  let html = `<div class="toolbar">
    <span class="count">${allSceneNums.length} scene${allSceneNums.length === 1 ? '' : 's'}</span>
    <span class="count">${(convData.log || []).length} turns</span>
    <span class="count">${aiCalls.length} AI calls</span>
    <span class="spacer"></span>
    <button class="btn btn-sm" onclick="setScenesCollapsed(false)">Expand all</button>
    <button class="btn btn-sm" onclick="setScenesCollapsed(true)">Collapse all</button>
  </div>`;

  // Setup calls (turn_number = null) — before any scene
  if (callsByTurn['setup'] && callsByTurn['setup'].length) {
    html += `
      <div class="log-entry" style="margin:0 0 14px">
        <div class="setup-header">Game setup</div>
        ${aiCallsSection(callsByTurn['setup'])}
      </div>`;
  }

  for (const sn of allSceneNums) {
    const scene = scenesByNum[sn];
    const turns = turnsByScene[sn] || [];
    const isCurrent = scene && scene.is_current;
    const turnCount = turns.length;

    // Scene header info
    let locDesc = 'Unknown location';
    let timeOfDay = '';
    if (scene) {
      locDesc = scene.description ? _truncate(scene.description, 120) : (scene.location_id || 'Unknown');
      timeOfDay = scene.time_of_day || '';
    }

    const npcs = (scene && scene.npcs_present) || [];
    const pois = (scene && scene.points_of_interest) || [];

    let infoHtml = '';
    if (npcs.length || pois.length) {
      const groups = [];
      if (npcs.length) {
        groups.push(_sceneInfoGroup('NPCs', ['#', 'Role', 'UUID'], npcs.map((npc, i) => {
          const role = typeof npc === 'object' ? (npc.role || '-') : npc;
          const uuid = typeof npc === 'object' ? (npc.uuid || '-') : '-';
          return `<tr><td>${i + 1}</td><td>${escapeHtml(role)}</td><td class="faint mono">${escapeHtml(uuid)}</td></tr>`;
        })));
      }
      if (pois.length) {
        groups.push(_sceneInfoGroup('Points of interest', ['#', 'Name'], pois.map((p, i) => {
          const label = typeof p === 'object' ? ((p.names && p.names.join(', ')) || '-') : p;
          return `<tr><td>${i + 1}</td><td>${escapeHtml(label)}</td></tr>`;
        })));
      }
      infoHtml = `<div class="scene-info">${groups.join('')}</div>`;
    }

    const descHtml = scene && scene.description ? `<div class="scene-desc">${escapeHtml(scene.description)}</div>` : '';

    const turnsHtml = turns.map(e => `
        <article class="log-entry">
          <div class="turn-info">Turn ${e.turn} · ${e.game_clock?.toFixed(1) ?? '?'}h</div>
          <div class="action">› ${escapeHtml(e.player_action)}</div>
          <div class="response">${escapeHtml(e.response)}</div>
          ${renderTurnChips(eventsByTurn[e.turn], npcsById)}
          ${aiCallsSection(callsByTurn[e.turn], e.turn)}
        </article>`).join('');

    html += `
      <section class="scene-block${isCurrent ? ' current' : ''}">
        <header class="scene-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev"></span>
          <div>
            <div class="scene-title">Scene ${sn}${isCurrent ? ' <span class="badge badge-playing">current</span>' : ''}</div>
            <div class="scene-meta">${escapeHtml(locDesc)}${timeOfDay ? ' · ' + escapeHtml(timeOfDay) : ''} · ${turnCount} turn${turnCount !== 1 ? 's' : ''}</div>
          </div>
        </header>
        <div class="scene-body">
          ${!scene ? '<div class="empty">Scene metadata unavailable (pre-migration)</div>' : ''}
          ${infoHtml}
          ${descHtml}
          ${turnsHtml || '<div class="empty">No turns in this scene</div>'}
        </div>
      </section>`;
  }

  el.innerHTML = html;
}

function _renderKvGrid(rows) {
  return `<div class="kv">${rows.map(([label, val]) => `<div class="label">${escapeHtml(label)}</div><div>${val}</div>`).join('')}</div>`;
}

function _renderChipList(items, cls, emptyText) {
  if (!items || !items.length) return `<span class="faint">${emptyText ?? 'empty'}</span>`;
  return items.map(it => `<span class="${cls}">${escapeHtml(String(it))}</span>`).join('');
}

function _renderObjectKv(obj) {
  const keys = Object.keys(obj || {});
  if (!keys.length) return '<span class="faint">empty</span>';
  return `<div class="kv">${keys.map(k => `<div class="label">${escapeHtml(k)}</div><div>${escapeHtml(String(obj[k]))}</div>`).join('')}</div>`;
}

function renderNpcStateTab(npc) {
  const scalarCard = `<div class="card"><h3>State</h3>${_renderKvGrid([
    ['Name', escapeHtml(npc.name || '')],
    ['Occupation', escapeHtml(npc.occupation || '-')],
    ['Mood', escapeHtml(npc.current_mood || '-')],
    ['Physical Status', escapeHtml(npc.physical_status || 'healthy')],
    ['Location', escapeHtml(npc.location_id || '-')],
    ['Knowledge Scope', escapeHtml(npc.knowledge_scope || '-')],
    ['Speech Style', escapeHtml(npc.speech_style || '-')],
  ])}</div>`;
  const attrsCard = `<div class="card"><h3>Attributes</h3>${_renderObjectKv(npc.attributes)}</div>`;
  const invCard = `<div class="card"><h3>Inventory</h3>${_renderChipList(npc.inventory, 'inv-chip')}</div>`;
  const traitsCard = `<div class="card"><h3>Personality Traits</h3>${_renderChipList(npc.personality_traits, 'traits-chip')}</div>`;
  const relsCard = `<div class="card"><h3>Relationships</h3>${_renderObjectKv(npc.relationships)}</div>`;
  const bioCard = `<div class="card"><h3>Biography</h3><div class="prose">${escapeHtml(npc.biography || '-')}</div></div>`;
  const appCard = `<div class="card"><h3>Appearance</h3><div class="prose">${escapeHtml(npc.appearance || '-')}</div></div>`;
  return `<div class="grid">${scalarCard + attrsCard + relsCard + invCard + traitsCard + appCard}</div>${bioCard}`;
}

async function renderNpcHistoryTab(npcId) {
  const [eventsData, aiData] = await Promise.all([
    fetchJSON(`/api/sessions/${currentSessionId}/turn-events?npc_id=${encodeURIComponent(npcId)}`),
    fetchJSON(`/api/sessions/${currentSessionId}/ai-calls`),
  ]);
  const events = eventsData.turn_events || [];
  const aiCalls = aiData.ai_calls || [];

  // Group events by turn
  const evByTurn = {};
  for (const ev of events) {
    if (ev.turn_number == null) continue;
    (evByTurn[ev.turn_number] = evByTurn[ev.turn_number] || []).push(ev);
  }

  // Show all calls for turns where the NPC acted (matching the NPC inside prompts is too fuzzy).
  const callsByTurn = {};
  for (const c of aiCalls) {
    const key = c.turn_number != null ? c.turn_number : 'setup';
    (callsByTurn[key] = callsByTurn[key] || []).push(c);
  }

  const turns = Object.keys(evByTurn).map(Number).sort((a, b) => a - b);
  if (!turns.length) return '<div class="empty">No recorded events for this NPC</div>';

  const npcsById = { [npcId]: { name: '' } };
  return turns.map(tn => `<div class="log-entry">
      <div class="turn-info">Turn ${tn}</div>
      ${renderTurnChips(evByTurn[tn], npcsById)}
      ${aiCallsSection(callsByTurn[tn], tn)}
    </div>`).join('');
}

function renderNpcMemoryTab(nodes, edges) {
  if (!nodes.length && !edges.length) {
    return '<div class="empty">No memory edges for this NPC</div>';
  }
  const nodesById = {};
  for (const n of nodes) nodesById[n.id] = n;
  const nodesTable = nodes.length ? `<div class="card"><h3>Memory nodes <span class="count">${nodes.length}</span></h3>
    ${tableHtml(['Content', 'Scope', 'Source', 'Canon', ['Confidence', 'num'], 'Tags', 'Time'], nodes.map(n => `<tr>
      <td class="wrap">${escapeHtml(_truncate(n.content, 200))}</td>
      <td>${escapeHtml(n.scope || '')}</td>
      <td>${escapeHtml(n.source || '')}</td>
      <td>${escapeHtml(n.canon || '')}</td>
      <td class="num">${n.confidence ?? '-'}</td>
      <td>${_renderChipList(n.tags, 'chip', '')}</td>
      <td>${n.timestamp ?? '-'}</td>
    </tr>`).join(''))}</div>` : '';
  const edgesTable = edges.length ? `<div class="card"><h3>Edges <span class="count">${edges.length}</span></h3>
    ${tableHtml(['Type', '→ Target node (snippet)'], edges.map(e => {
      const target = nodesById[e.to_node_id];
      const snippet = target ? _truncate(target.content, 120) : e.to_node_id;
      return `<tr><td><span class="chip">${escapeHtml(e.edge_type || '')}</span></td><td>${escapeHtml(snippet)}</td></tr>`;
    }).join(''))}</div>` : '';
  return nodesTable + edgesTable;
}

async function renderNpcDetail(el) {
  const data = await fetchJSON(`/api/sessions/${currentSessionId}/npcs/${encodeURIComponent(currentNpcId)}`);
  if (data.error) { el.innerHTML = `<div class="empty">${escapeHtml(data.error)}</div>`; return; }
  const npc = data.npc;
  const nodes = data.memory_nodes || [];
  const edges = data.memory_edges || [];

  const subtabs = ['state', 'history', 'memory'];
  el.innerHTML = `<div class="npc-detail-header">
    <button class="btn btn-sm" onclick="backToNpcs()">← NPCs</button>
    <h2>${escapeHtml(npc.name || 'NPC')}</h2>
    ${npc.occupation ? `<span class="muted">${escapeHtml(npc.occupation)}</span>` : ''}
  </div>
  <div class="subtabs">
    ${subtabs.map(t => `<button class="subtab ${t === currentNpcTab ? 'active' : ''}" onclick="switchNpcTab('${t}')">${t}</button>`).join('')}
  </div>
  <div id="npc-subtab-content"></div>`;

  const content = document.getElementById('npc-subtab-content');
  if (currentNpcTab === 'history') {
    content.innerHTML = LOADING;
    content.innerHTML = await renderNpcHistoryTab(currentNpcId);
  } else if (currentNpcTab === 'memory') {
    content.innerHTML = renderNpcMemoryTab(nodes, edges);
  } else {
    content.innerHTML = renderNpcStateTab(npc);
  }
}

const _KNOWLEDGE_ROW_CAP = 200;
let _knowledgeNodes = [];

async function renderKnowledge(el) {
  const d = await fetchJSON(`/api/sessions/${currentSessionId}/knowledge`);
  _knowledgeNodes = d.nodes || [];
  const edges = d.edges || [];
  el.innerHTML = `<div class="stats">
      ${statTile('Nodes', fmtNum(_knowledgeNodes.length))}
      ${statTile('Edges', fmtNum(edges.length))}
    </div>
    <div class="toolbar"><input class="input" type="search" placeholder="Filter by content, scope, source, tag…" oninput="drawKnowledgeRows(this.value)">
      <span id="knowledge-shown" class="help" style="margin:0"></span></div>
    <div id="knowledge-table"></div>`;
  drawKnowledgeRows('');
}

function drawKnowledgeRows(query) {
  const q = query.trim().toLowerCase();
  const matches = q
    ? _knowledgeNodes.filter(n => [n.content, n.scope, n.source, ...(n.tags || [])].join(' ').toLowerCase().includes(q))
    : _knowledgeNodes;
  const shown = matches.slice(0, _KNOWLEDGE_ROW_CAP);
  document.getElementById('knowledge-shown').textContent = matches.length > shown.length
    ? `Showing ${shown.length} of ${matches.length} — refine the filter to see more`
    : `${matches.length} node${matches.length === 1 ? '' : 's'}`;
  document.getElementById('knowledge-table').innerHTML = shown.length
    ? tableHtml(['Content', 'Scope', 'Source', ['Confidence', 'num'], 'Tags'], shown.map(n => `<tr>
        <td class="wrap">${escapeHtml(_truncate(n.content, 160))}</td>
        <td>${escapeHtml(n.scope)}</td>
        <td>${escapeHtml(n.source)}</td>
        <td class="num">${escapeHtml(n.confidence)}</td>
        <td>${_renderChipList(n.tags, 'chip', '')}</td>
      </tr>`).join(''))
    : '<div class="empty">No matching nodes</div>';
}

// ---- Feedback ----

async function renderFeedbackView() {
  setPage(LOADING);
  try {
    const data = await fetchJSON('/api/admin/beta/feedback');
    const rows = data.feedback || [];
    const header = pageHeader('Beta feedback', `${rows.length} entr${rows.length === 1 ? 'y' : 'ies'}`,
      '<button class="btn" onclick="downloadFeedbackCsv()">⤓ Export CSV</button>');
    if (!rows.length) {
      setPage(header + '<div class="empty">No feedback yet.</div>');
      return;
    }
    setPage(`${header}<div class="toolbar">${filterInput('feedback-table', 'Filter by user, setting, message…')}</div>
      ${tableHtml(['Time', 'User', 'Game', ['Turn', 'num'], 'Category', 'Message'], rows.map(row => `<tr>
          <td>${fmtRel(row.created_at)}</td>
          <td>${renderFeedbackUserCell(row)}</td>
          <td>${idChip(row.game_id)}<div class="muted">${escapeHtml(row.setting || '')}</div></td>
          <td class="num">${row.turn_number ?? ''}</td>
          <td>${row.category ? `<span class="chip">${escapeHtml(row.category)}</span>` : ''}</td>
          <td class="wrap">${escapeHtml(row.message || '')}</td>
        </tr>`).join(''), 'feedback-table')}`);
  } catch (e) {
    setPage(errorBox('feedback', e));
  }
}

function renderFeedbackUserCell(row) {
  // D008: account_email is canonical (live JOIN); user_email is orphan fallback only.
  if (row.account_email && row.user_id) {
    return `<span class="view-link" onclick="openUserFromCrossLink('${row.user_id}')">${escapeHtml(row.account_email)}</span>`;
  }
  const fallback = row.user_email || row.user_id;
  return fallback ? escapeHtml(fallback) : '—';
}

// ---- Reliability ----

const _RELIABILITY_WINDOWS = ['24h', '7d', '30d'];
let _reliabilityWindow = '24h';

async function renderReliabilityView() {
  setPage(LOADING);
  try {
    const data = await fetchJSON('/api/admin/reliability?window=' + _reliabilityWindow);
    setPage(renderReliabilityHtml(data));
  } catch (e) {
    setPage(errorBox('reliability', e));
  }
}

function _reliabilityWindowButtons() {
  return `<div class="segmented">${_RELIABILITY_WINDOWS.map(w =>
    `<button class="${w === _reliabilityWindow ? 'active' : ''}" onclick="switchReliabilityWindow('${w}')">${w}</button>`
  ).join('')}</div>`;
}

function switchReliabilityWindow(w) { go('#/reliability/' + w); }

function _groupReliabilityRows(rows) {
  const byAgent = {};
  for (const row of rows) {
    if (!byAgent[row.agent]) byAgent[row.agent] = {};
    byAgent[row.agent][row.event_type] = row.total;
  }
  return byAgent;
}

function renderReliabilityHtml(data) {
  const rows = data.rows || [];
  const windowLabel = data.window || _reliabilityWindow;
  const header = pageHeader('Reliability', `Per-agent fallback / retry / schema-failure counts · last ${escapeHtml(windowLabel)}`,
    _reliabilityWindowButtons());

  if (!rows.length) {
    return `${header}<div class="empty">No reliability snapshots in the last ${escapeHtml(windowLabel)}.</div>`;
  }

  const eventTypes = [...new Set(rows.map(r => r.event_type))].sort();
  const byAgent = _groupReliabilityRows(rows);
  const agents = Object.keys(byAgent).sort();

  const bodyRows = agents.map(agent => {
    const cells = eventTypes.map(et => {
      const val = byAgent[agent][et] || 0;
      return `<td class="num ${val > 0 ? 'hot' : 'zero'}">${fmtNum(val)}</td>`;
    }).join('');
    return `<tr><td>${agentBadge(agent)}</td>${cells}</tr>`;
  }).join('');

  return `${header}
    <p class="help">Summed from <code>turn_events.payload</code> reliability snapshots. Non-zero cells are highlighted.</p>
    ${tableHtml(['Agent', ...eventTypes.map(et => [escapeHtml(et), 'num'])], bodyRows)}`;
}

// ---- Settings ----

async function renderSettingsView() {
  setPage(LOADING);
  try {
    const [keys, models, search] = await Promise.all([
      fetchJSON('/api/settings/keys'),
      fetchJSON('/api/settings/models'),
      fetchJSON('/api/settings/search'),
    ]);
    setPage(renderSettingsHtml(keys, models, search));
  } catch (e) {
    setPage(errorBox('settings', e));
  }
}

function sourceBadge(source) {
  return `<span class="badge ${source === 'db' ? 'badge-info' : 'badge-idle'}" title="Where the active value comes from">source: ${escapeHtml(source || '?')}</span>`;
}

function renderSettingsHtml(keys, models, search) {
  _settingsCatalog = models.catalog || [];
  _settingsKeys = keys || {};

  const keysCard = `<div class="card"><h3>API keys</h3>
    <div class="kv">
      ${['openai', 'anthropic', 'openrouter'].map(p =>
        `<div class="label">${p}</div><div>${keys[p]
          ? '<span class="badge badge-green">Configured</span>'
          : '<span class="badge badge-red">Missing</span>'}</div>`
      ).join('')}
    </div>
  </div>`;

  const roles = models.roles || {};
  const providers = [...new Set(_settingsCatalog.map(m => m.provider))].sort();

  const rolesCard = `<div class="card"><h3>Model roles</h3>
    <p class="help">Pick a model from the catalog or type any model id. Providers without an API key are disabled.</p>
    <div class="role-grid">
    ${['director', 'agent', 'narrator', 'dramaturge'].map(role => {
      const current = roles[role] || {provider: '', model_id: '', source: 'default'};
      const currentProvider = providers.includes(current.provider) ? current.provider : '';

      const providerOptions = providers.map(p =>
        `<option value="${escapeHtml(p)}" ${p === currentProvider ? 'selected' : ''}>${escapeHtml(p)}</option>`
      ).join('');

      const modelOptions = _buildModelOptions(currentProvider, current.model_id);

      return `<div class="settings-role" data-role="${role}">
        <h4>${role}</h4>
        <div class="current"><code>${escapeHtml(current.provider || '?')}</code> / <code>${escapeHtml(current.model_id || '?')}</code>
          ${sourceBadge(current.source)}
        </div>
        <div class="settings-row">
          <select class="input settings-provider-${role}" onchange="onProviderPick('${role}', this.value)" aria-label="${role} provider">
            <option value="">— provider —</option>
            ${providerOptions}
          </select>
          <select class="input settings-model-${role}" onchange="onModelPick('${role}', this.value)" aria-label="${role} model">
            <option value="">— model —</option>
            ${modelOptions}
          </select>
        </div>
        <div class="settings-row">
          <input type="text" class="input settings-input-${role}" aria-label="${role} model id"
                 placeholder="or type a custom model_id (e.g. deepseek/deepseek-chat-v3.1)"
                 value="${escapeHtml(current.model_id || '')}"
                 onkeydown="if (event.key === 'Enter') saveModel('${role}')">
          <button class="btn btn-primary" onclick="saveModel('${role}')">Save</button>
        </div>
      </div>`;
    }).join('')}
    </div>
  </div>`;

  return pageHeader('Settings', 'Runtime overrides stored in the database take precedence over env defaults')
    + `<div class="grid">${keysCard}${renderSearchCard(search)}</div>` + rolesCard;
}

function _buildModelOptions(provider, currentModelId) {
  if (!provider) return '';
  const hasKey = !!_settingsKeys[provider];
  return _settingsCatalog
    .filter(m => m.provider === provider)
    .map(m => {
      const sel = m.model_id === currentModelId ? 'selected' : '';
      const dis = hasKey ? '' : 'disabled';
      return `<option value="${escapeHtml(m.model_id)}" ${dis} ${sel}>${escapeHtml(m.model_id)}</option>`;
    }).join('');
}

function detectProviderFromModelId(modelId) {
  const m = (modelId || '').toLowerCase();
  const orPrefixes = ['deepseek/','google/','x-ai/','qwen/','moonshotai/','meta-llama/','mistralai/'];
  if (orPrefixes.some(p => m.startsWith(p))) return 'openrouter';
  if (/^(gpt-|o1|o3|o4)/.test(m)) return 'openai';
  if (m.startsWith('claude')) return 'anthropic';
  return null;
}

function onProviderPick(role, provider) {
  const modelSelect = document.querySelector(`.settings-model-${role}`);
  if (modelSelect) {
    modelSelect.innerHTML = '<option value="">— model —</option>' + _buildModelOptions(provider, '');
    modelSelect.value = '';
  }
  const input = document.querySelector(`.settings-input-${role}`);
  if (input) input.value = '';
}

function onModelPick(role, modelId) {
  const input = document.querySelector(`.settings-input-${role}`);
  if (input) input.value = modelId;
}

function renderSearchCard(search) {
  const s = search || {};
  const providers = s.providers || ['wikipedia', 'tavily', 'searxng'];
  const cur = s.provider || 'wikipedia';
  const opts = providers.map(p =>
    `<option value="${escapeHtml(p)}" ${p === cur ? 'selected' : ''}>${escapeHtml(p)}</option>`
  ).join('');
  const keyHint = s.tavily_api_key_set ? 'configured — leave blank to keep' : 'tvly-...';
  return `<div class="card"><h3>Search provider</h3>
    <div class="current help"><code>${escapeHtml(cur)}</code> ${sourceBadge(s.source || 'env')}</div>
    <div class="settings-row">
      <label class="field-label" for="search-provider">Provider</label>
      <select id="search-provider" class="input">${opts}</select>
    </div>
    <div class="settings-row">
      <label class="field-label" for="search-tavily-key">Tavily API key</label>
      <input type="password" id="search-tavily-key" class="input" placeholder="${escapeHtml(keyHint)}">
    </div>
    <div class="settings-row">
      <label class="field-label" for="search-searxng-url">SearXNG URL</label>
      <input type="text" id="search-searxng-url" class="input" placeholder="https://searx.example.org" value="${escapeHtml(s.searxng_base_url || '')}">
    </div>
    <div class="settings-row" style="justify-content:flex-end">
      <button class="btn btn-ghost" onclick="clearSearch()">Reset to default</button>
      <button class="btn btn-primary" onclick="saveSearch()">Save</button>
    </div>
  </div>`;
}

async function saveSearch() {
  const provider = document.getElementById('search-provider').value;
  const tavily = (document.getElementById('search-tavily-key').value || '').trim();
  const searxng = (document.getElementById('search-searxng-url').value || '').trim();
  const body = {provider};
  if (tavily) { body.tavily_api_key = tavily; }
  if (searxng) { body.searxng_base_url = searxng; }
  try {
    await fetchJSON('/api/settings/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    toast(`Search provider saved: ${provider}`);
    renderSettingsView();
  } catch (e) {
    toast(e.message, 'err');
  }
}

async function clearSearch() {
  try {
    await fetchJSON('/api/settings/search', {method: 'DELETE'});
    toast('Search provider reset to env/default');
    renderSettingsView();
  } catch (e) {
    toast(e.message, 'err');
  }
}

async function saveModel(role) {
  const input = document.querySelector(`.settings-input-${role}`);
  const providerSelect = document.querySelector(`.settings-provider-${role}`);
  const modelId = (input?.value || '').trim();
  if (!modelId) {
    toast(`${role}: model_id is empty`, 'err');
    return;
  }
  const provider = providerSelect?.value || detectProviderFromModelId(modelId);
  if (!provider) {
    toast(`${role}: could not detect provider from model_id — pick one from the catalog`, 'err');
    return;
  }
  try {
    await fetchJSON('/api/settings/models', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({role, provider, model_id: modelId}),
    });
    toast(`${role} → ${provider} / ${modelId}`);
    renderSettingsView();
  } catch (e) {
    toast(`${role}: ${e.message}`, 'err');
  }
}

// ---- Boot ----

// "/" focuses the visible list search, like most admin tools.
document.addEventListener('keydown', e => {
  if (e.key !== '/' || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  const input = [...document.querySelectorAll('.list-panel .search')].find(el => el.offsetParent);
  if (input) { e.preventDefault(); input.focus(); input.select(); }
});

// Auto-refresh session list every 5s (preserving the active search) while the tab is visible.
async function startDashboard() {
  window.addEventListener('hashchange', route);
  try { await loadSessions(); } catch (e) { toast('Could not load sessions: ' + e.message, 'err'); }
  route();
  setInterval(() => {
    if (currentView === 'sessions' && !document.hidden) loadSessions(currentSearchTerm()).catch(() => {});
  }, 5000);
}

initAuth().then(ready => { if (ready) startDashboard(); });
</script>
