name: Monthly noise-floor recalibration

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  recalibrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python via uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev --extra openai --extra anthropic

      - name: Run calibration with drift comparison
        id: calibrate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Engine models stay on the GPT-5.4 set the committed baselines were
          # calibrated on (ADR-0002); move them with a baseline re-pin (ADR-0018).
          DIRECTOR_MODEL: gpt-5.4-mini
          AGENT_MODEL: gpt-5.4-nano
          NARRATOR_MODEL: gpt-5.4-mini
          DRAMATURGE_MODEL: gpt-5.4-nano
        run: |
          set +e
          # Panel cap MUST match benchmark-on-pr.yml (odd, 5): the calibrated noise
          # floor is the variance scale the Bayesian PR comparison applies, so a
          # different (noisier) panel here mis-scales the reported probabilities.
          uv run python -m benchmarks calibrate --iterations 5 --max-judges 5 --compare-to-baselines > calibration_output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat calibration_output.txt

      - name: File drift alert issue
        if: steps.calibrate.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build the body in a file: a multi-line --body string would start
          # lines at column 1 inside this block scalar, which is invalid YAML.
          {
            echo "## Noise-floor drift alert"
            echo
            echo "Calibration detected ≥50% stdev drift in at least one scenario."
            echo
            echo '```'
            cat calibration_output.txt
            echo '```'
            echo
            echo 'Re-run `benchmarks calibrate` locally and investigate before merging new benchmarks.'
          } > issue_body.md
          gh issue create \
            --title "noise floor drift detected ($(date -u '+%Y-%m-%d'))" \
            --body-file issue_body.md \
            --label "benchmarks"

      - name: Archive calibration JSON
        # Upload on drift too: after a deliberate engine or judge change the new
        # noise floor is exactly what the operator needs to re-pin (ADR-0019).
        if: always() && steps.calibrate.outputs.exit_code != ''
        uses: actions/upload-artifact@v4
        with:
          name: calibration-${{ github.run_id }}
          path: benchmarks/baselines/.calibration.json
          if-no-files-found: warn

      - name: Fail job on drift
        if: steps.calibrate.outputs.exit_code == '1'
        run: exit 1
