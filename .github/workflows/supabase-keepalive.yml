name: Supabase keepalive

# Supabase pauses Free-plan projects after ~7 days without user database
# queries; while paused, player login is down. One query a day keeps it awake.
on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC every day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the Supabase database
        env:
          # Session-pooler connection string (IPv4) from the Supabase dashboard "Connect" panel.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set"
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -tAc 'select 1'
