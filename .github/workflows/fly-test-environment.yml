name: Fly test environment

on:
  workflow_dispatch:
    inputs:
      test_command:
        description: "Command to run inside the Fly test machine"
        required: false
        default: "uv run pytest tests/ --ignore=tests/e2e --ignore=tests/benchmarks --ignore=tests/db -m 'not db and not benchmark and not live' -v"
        type: string
      run_live_e2e:
        description: "Also run the live-provider e2e suite after the deterministic command"
        required: false
        default: false
        type: boolean
      suspend_after:
        description: "Scale the Fly test app to zero after the run"
        required: false
        default: true
        type: boolean

concurrency:
  group: fly-test-environment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fly-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_TEST_APP: ${{ vars.FLY_TEST_APP || secrets.FLY_TEST_APP }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
      FLY_REGION: ${{ vars.FLY_TEST_REGION || 'ams' }}
      TEST_COMMAND: ${{ inputs.test_command }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly configuration
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?Set the FLY_API_TOKEN GitHub Actions secret.}"
          : "${FLY_TEST_APP:?Set a FLY_TEST_APP GitHub Actions variable or secret.}"
          case "$FLY_TEST_APP" in
            storyteller-quest)
              echo "::error title=Unsafe Fly app::FLY_TEST_APP must not be the production storyteller-quest app."
              exit 1
              ;;
          esac

      - name: Ensure Fly app exists
        run: |
          set -euo pipefail
          if flyctl status --app "$FLY_TEST_APP" >/dev/null 2>&1; then
            echo "Fly test app already exists: $FLY_TEST_APP"
          else
            flyctl apps create "$FLY_TEST_APP" --org "$FLY_ORG" --yes
          fi

      - name: Stage optional runtime secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          set -euo pipefail
          secret_args=()
          for name in OPENAI_API_KEY ANTHROPIC_API_KEY OPENROUTER_API_KEY DEEPSEEK_API_KEY TAVILY_API_KEY; do
            if [ -n "${!name:-}" ]; then
              secret_args+=("$name=${!name}")
            fi
          done
          if [ "${#secret_args[@]}" -gt 0 ]; then
            flyctl secrets set --stage --app "$FLY_TEST_APP" "${secret_args[@]}"
          else
            echo "No optional provider/search secrets present; deterministic tests can still run."
          fi

      - name: Deploy latest Storyteller test image
        run: |
          set -euo pipefail
          flyctl deploy \
            --remote-only \
            --config fly.test.toml \
            --dockerfile Dockerfile.test \
            --primary-region "$FLY_REGION" \
            --app "$FLY_TEST_APP" \
            --detach
          flyctl status --app "$FLY_TEST_APP"

      - name: Run requested deterministic test command
        run: |
          set -euo pipefail
          flyctl ssh console --app "$FLY_TEST_APP" --command "$TEST_COMMAND"

      - name: Run live-provider e2e suite
        if: inputs.run_live_e2e
        run: |
          set -euo pipefail
          e2e_command="test -n \"\$OPENAI_API_KEY\" && uv run pytest tests/e2e/ --alluredir=allure-results -v"
          flyctl ssh console --app "$FLY_TEST_APP" --command "$e2e_command"

      - name: Suspend Fly test app
        if: always() && inputs.suspend_after
        run: |
          set -euo pipefail
          flyctl scale count 0 --yes --app "$FLY_TEST_APP"
