name: Benchmarks

# Manual-dispatch workflow for running the narration benchmark harness.
# Hits paid LLMs (judge panel of up to 6 models), so runs are opt-in only.
# Results are archived under benchmarks/results/ and uploaded as an artifact
# for release-over-release comparison.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario id (leave blank to run every registered scenario)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "memory_follow_up_marcus"
          - "autonomy_three_guards_tavern"
          - "narrator_prose_quiet_exploration"
          - "scene_builder_re_entry_consistency"
          - "npc_generator_role_fidelity"
      iterations:
        description: "Iterations per scenario"
        required: false
        default: "1"
        type: string
      judges:
        description: "Comma-separated judge override (leave blank to auto-assemble the panel from available API keys)"
        required: false
        default: ""
        type: string
      max_judges:
        description: "Cap the panel size (leave blank to use the default of 6)"
        required: false
        default: ""
        type: string
      director_model:
        description: "Experiment only: Director model"
        required: false
        default: "gpt-5.4-mini"
        type: string
      agent_model:
        description: "Experiment only: agent model"
        required: false
        default: "gpt-5.4-nano"
        type: string
      narrator_model:
        description: "Experiment only: Narrator model"
        required: false
        default: "gpt-5.4-mini"
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev --extra anthropic --extra openai

      - name: Run benchmark harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Engine models stay on the GPT-5.4 set the committed baselines were
          # calibrated on (ADR-0002); move them with a baseline re-pin (ADR-0018).
          DIRECTOR_MODEL: ${{ inputs.director_model }}
          AGENT_MODEL: ${{ inputs.agent_model }}
          NARRATOR_MODEL: ${{ inputs.narrator_model }}
          DRAMATURGE_MODEL: gpt-5.4-nano
          SCENARIO_INPUT: ${{ inputs.scenario }}
          ITERATIONS_INPUT: ${{ inputs.iterations }}
          JUDGES_INPUT: ${{ inputs.judges }}
          MAX_JUDGES_INPUT: ${{ inputs.max_judges }}
        run: |
          set -euo pipefail
          args=(run)
          if [ -n "${SCENARIO_INPUT}" ]; then
            args+=(--scenario "${SCENARIO_INPUT}")
          fi
          if [ -n "${ITERATIONS_INPUT}" ]; then
            args+=(--iterations "${ITERATIONS_INPUT}")
          fi
          if [ -n "${JUDGES_INPUT}" ]; then
            args+=(--judges "${JUDGES_INPUT}")
          fi
          if [ -n "${MAX_JUDGES_INPUT}" ]; then
            args+=(--max-judges "${MAX_JUDGES_INPUT}")
          fi
          uv run python -m benchmarks "${args[@]}"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ inputs.director_model }}-${{ inputs.agent_model }}-${{ inputs.narrator_model }}
          path: benchmarks/results/
          if-no-files-found: warn
