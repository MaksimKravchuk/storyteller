name: Fly Preview Deployments

# Spin up a per-PR Fly.io app at `storyteller-quest-pr-<PR>.fly.dev` when a
# pull request is opened or updated, and tear it down when the PR is closed.
#
# Each preview gets its own logical database on the shared
# `storyteller-preview-db` Postgres cluster via `flyctl postgres attach`,
# which generates per-app credentials and writes DATABASE_URL onto the app.
# `flyctl postgres detach` reverses both on PR close.
#
# Required repository secrets:
#   FLY_API_TOKEN     - **Org-scoped** Fly token (must allow `apps create`).
#                       Mint with `flyctl tokens create org <slug>`. Reused
#                       by the production deploy in `ci.yml`.
#   FLY_ORG           - Fly organisation slug that owns preview apps.
#   OPENAI_API_KEY    - optional; omit to run without OpenAI.
#   ANTHROPIC_API_KEY - optional; omit to run without Anthropic.
#
# Required Fly infra (provisioned out-of-band, once per environment):
#   - A Postgres cluster named `storyteller-preview-db` in the same org.
#
# PRs from forks are intentionally skipped — GitHub does not expose secrets
# to fork workflows, so a deploy would always fail. Collaborators should
# push PR branches to this repo to get a preview.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One deploy per PR at a time; superseded runs are cancelled so the latest
# commit always wins. Cleanup is handled in the same group so a cancelled
# deploy cannot leak an app after the PR is closed.
concurrency:
  group: fly-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLY_APP: storyteller-quest-pr-${{ github.event.pull_request.number }}
  PREVIEW_DB_CLUSTER: storyteller-preview-db

jobs:
  deploy:
    name: Deploy preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: ${{ secrets.FLY_ORG }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          missing=""
          [ -z "$FLY_API_TOKEN" ] && missing="$missing FLY_API_TOKEN"
          [ -z "$FLY_ORG" ] && missing="$missing FLY_ORG"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "See README.md → 'Per-PR preview deployments' for setup."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly app if it does not exist
        run: |
          if flyctl status --app "$FLY_APP" >/dev/null 2>&1; then
            echo "App $FLY_APP already exists — reusing."
          else
            echo "Creating new Fly app: $FLY_APP"
            flyctl apps create "$FLY_APP" --org "$FLY_ORG"
          fi

      - name: Allocate public IPs if missing
        # `flyctl apps create` does not auto-allocate IPs the way
        # `flyctl launch` does, so a freshly-created app has no
        # routable address even after `deploy`. The jq guards are
        # required: `allocate-v6` is not idempotent and would allocate
        # an additional dedicated v6 (and bill for it) on every re-run.
        run: |
          ips=$(flyctl ips list --app "$FLY_APP" --json)
          if ! echo "$ips" | jq -e 'any(.[]; .Type == "shared_v4")' >/dev/null; then
            flyctl ips allocate-v4 --shared --app "$FLY_APP"
          fi
          if ! echo "$ips" | jq -e 'any(.[]; .Type == "v6")' >/dev/null; then
            flyctl ips allocate-v6 --app "$FLY_APP"
          fi

      - name: Attach preview database
        # `postgres attach` creates a per-app role + database on the
        # shared cluster and writes DATABASE_URL onto the preview app.
        # If DATABASE_URL is already set we assume a previous run already
        # attached this app and skip — `attach` is not idempotent and will
        # error on re-run.
        run: |
          if flyctl secrets list --app "$FLY_APP" --json 2>/dev/null \
            | jq -e 'any(.[]; .name == "DATABASE_URL")' >/dev/null; then
            echo "DATABASE_URL already set on $FLY_APP — reusing existing attachment."
          else
            echo "Attaching $FLY_APP to $PREVIEW_DB_CLUSTER"
            flyctl postgres attach "$PREVIEW_DB_CLUSTER" \
              --app "$FLY_APP" \
              --variable-name DATABASE_URL \
              --yes
          fi

      - name: Set app secrets
        run: |
          # --stage writes secrets without triggering a release; the next
          # `flyctl deploy` will pick them up atomically.
          flyctl secrets set --app "$FLY_APP" --stage \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"

      - name: Deploy to Fly
        run: |
          flyctl deploy \
            --app "$FLY_APP" \
            --config fly.preview.toml \
            --remote-only \
            --yes

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: fly-preview
          message: |
            ### Fly.io preview deployed

            | Service | URL |
            | ------- | --- |
            | Web UI  | https://${{ env.FLY_APP }}.fly.dev |
            | Admin   | https://${{ env.FLY_APP }}.fly.dev:8080 |
            | Health  | https://${{ env.FLY_APP }}.fly.dev/healthz |

            Commit: `${{ github.event.pull_request.head.sha }}`

            The app auto-stops when idle and cold-starts on the next request.
            It will be destroyed automatically when this PR is closed.

  cleanup:
    name: Destroy preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Detach preview database
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN not set — skipping detach."
            exit 0
          fi
          if flyctl status --app "$FLY_APP" >/dev/null 2>&1; then
            # `postgres detach` drops the per-app role + database on the
            # cluster. Failure is non-fatal — we still want to destroy the
            # app even if detach has already run or the cluster is gone.
            flyctl postgres detach "$PREVIEW_DB_CLUSTER" --app "$FLY_APP" --yes || \
              echo "Detach failed or already done — continuing."
          fi

      - name: Destroy Fly app (if present)
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN not set — skipping cleanup."
            exit 0
          fi
          if flyctl status --app "$FLY_APP" >/dev/null 2>&1; then
            echo "Destroying $FLY_APP"
            flyctl apps destroy "$FLY_APP" --yes
          else
            echo "App $FLY_APP not found — nothing to clean up."
          fi

      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: fly-preview
          message: |
            ### Fly.io preview destroyed

            The preview app `${{ env.FLY_APP }}` has been torn down.
