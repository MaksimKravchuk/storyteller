name: Benchmark gate (narrative PRs)

# Automatic narration benchmark check triggered by pull requests that touch
# narrative-affecting code paths.  Each run hits paid LLMs:
#
#   Cost estimate (5-judge panel, 1 iteration, 5 scenarios):
#   - ~25 scenario × judge dispatch calls (5 scenarios × ~1 element avg × 5 judges)
#   - Typical spend: ~$0.03–$0.17 per PR push depending on element count and models
#   - We spend on the cheap axis (judge votes over one fixed transcript) rather
#     than the expensive one (extra engine iterations): a wider panel beats down
#     judge variance — the dominant noise source once temperature is pinned —
#     without re-running the multi-agent engine. See ADR-0013.
#   - The cap is ODD (5, not 6) so an evidence element cannot split evenly: a 3-3
#     tie scores round(base*3/6)=0 on a 1-point element, which would add a
#     downward bias instead of just reducing variance. Keep the recalibration and
#     baseline workflows on the SAME cap so the pinned noise floor scales to it.
#   - A concurrency cancel-in-progress block below ensures only the HEAD commit
#     of each PR actually incurs cost.
#
# WHAT THIS POSTS (advisory, see ADR-0009):
#   A single markdown comment rendered by `benchmarks pr-comment`:
#   1. Headline badge + per-scenario summary table — the auto-compare verdict
#      (frequentist, ADR-0002) and the graded Bayesian P(regression) per scenario,
#      scored against the git-tracked pinned baselines. Shows `no baseline` until a
#      scenario is pinned; that is non-blocking by design.
#   2. Pooled portfolio line — the systematic-shift posterior (ADR-0013).
#   3. Collapsible per-element deltas + a "how to read this" glossary.
#   4. Narration diff between the previous main version (downloaded from the
#      `benchmark-baseline` artifact, CONTENT ONLY) and this PR's fresh run.
#
# REQUIRED STATUS CHECK SETUP (manual step):
#   Do NOT enable "benchmark-on-pr / benchmark" as a required branch-protection
#   check.  Because of the `paths:` filter, the workflow never runs on PRs that
#   don't touch the listed files, which would leave those PRs blocked forever
#   waiting for a status that never arrives.  Instead treat this as an advisory
#   gate: read the posted comment before merging narrative PRs.  The job stays
#   green even on a regression — the comment is the signal, not the check.
#
# FORK PRs:
#   This workflow uses `pull_request` (not `pull_request_target`), so secrets
#   are NOT available to forks and the GITHUB_TOKEN is read-only.  Benchmark LLM
#   calls and the PR comment will fail silently for external fork PRs — that is
#   expected and safe.

on:
  pull_request:
    paths:
      - "cast/**"
      - "prompts/**"
      - "engine/**"
      - "benchmarks/scenarios/**"

concurrency:
  group: benchmark-on-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # download the benchmark-baseline artifact from a prior main run
      pull-requests: write # post the advisory comparison comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev --extra anthropic --extra openai

      - name: Clear stale committed results
        # The checkout carries historical benchmarks/results/*.json; drop them so
        # the run output, narration diff, and uploaded artifact are this PR only.
        run: find benchmarks/results -type f ! -name '.gitkeep' -delete

      - name: Run benchmark harness (1 iteration, 5-judge panel)
        # Advisory: capture the auto-compare verdict but never fail the job on a
        # regression. The posted comment is the signal; the check stays green.
        # `continue-on-error` keeps the job green if the harness exits 1, and the
        # explicit `set +e` neutralises the runner's default `bash -e` so the
        # exit-code line still prints (the CLI's own exit-1 gate is untouched).
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIRECTOR_MODEL: gpt-5.4-mini
          AGENT_MODEL: gpt-5.4-nano
          NARRATOR_MODEL: gpt-5.4-mini
        run: |
          set +e
          set -o pipefail
          uv run python -m benchmarks run --iterations 1 --max-judges 5 | tee bench_stdout.txt
          echo "benchmark exit code: ${PIPESTATUS[0]}"
          exit 0

      - name: Download previous-version baseline content
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p prev_content
          run_id=$(gh run list --workflow benchmark-baseline.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "${run_id:-}" ]; then
            gh run download "$run_id" --name benchmark-baseline --dir prev_content \
              || echo "baseline artifact download failed (expired or missing)"
          else
            echo "no successful benchmark-baseline run found on main yet"
          fi

      - name: Build comparison comment
        if: always()
        run: |
          # `set +e`: best-effort comment assembly. A non-zero exit from the
          # renderer must not abort the step under the runner's default `bash -e`
          # and leave the post step with no file.
          set +e
          # Resolve where upload-artifact placed the baseline files: at the artifact
          # root (prev_content/) or under a preserved prefix. Falls back to the empty
          # prev_content dir so the narration diff degrades to "no baseline" cleanly.
          prev_dir="prev_content"
          found="$(find prev_content -name '*_iter*.json' 2>/dev/null | head -1)"
          if [ -n "$found" ]; then
            prev_dir="$(dirname "$found")"
          fi
          # Single renderer: scores aggregates against pinned baselines (frequentist
          # + Bayesian), builds the narration diff, and emits the whole markdown.
          uv run python -m benchmarks pr-comment benchmarks/results --previous "$prev_dir" > comment.md
          if [ ! -s comment.md ]; then
            printf '## 🎭 Benchmark comparison\n_(comment generation failed — see job log)_\n' > comment.md
          fi

      - name: Post comparison comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          pr="${{ github.event.pull_request.number }}"
          gh pr comment "$pr" --edit-last --body-file comment.md \
            || gh pr comment "$pr" --body-file comment.md \
            || echo "comment skipped (fork PR / read-only token)"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-pr-${{ github.event.pull_request.number }}
          path: benchmarks/results/
          if-no-files-found: warn
