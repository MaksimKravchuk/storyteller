name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'benchmarks/results/**'
      - 'logs.json'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - '**.md'
      - 'benchmarks/results/**'
      - 'logs.json'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      run_mutation:
        description: 'Run the mutation-testing job (full pilot scope, no threshold gating)'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Flake8 / wemake
        run: uv run flake8 .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra openai --extra anthropic --extra telegram

      - name: Run unit tests with coverage and Allure
        run: |
          set -o pipefail
          uv run pytest tests/ --ignore=tests/e2e -v \
            --cov --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=90 \
            --alluredir=allure-results-unit | tee pytest-coverage.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload Allure unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-unit
          path: allure-results-unit/

      - name: Post coverage comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          title: "Test Coverage Report"
          badge-title: "Coverage"
          hide-comment: false
          create-new-comment: false

      - name: Run type checking
        run: uv run mypy .

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_mutation)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the diff-scope step can compare against the merge-base.
          fetch-depth: 0

      - name: Check if PR touches mutation-testing pilot scope
        id: scope
        run: |
          set -euo pipefail
          # Manual dispatch always runs the full pilot scope — no diff to check.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch; running full pilot scope."
            echo "in_scope=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          # git's default pathspec ``*`` matches across ``/``, so
          # ``models/*.py`` captures nested files too. ``__init__.py``
          # is mutation-irrelevant and excluded.
          CHANGED=$(git diff --name-only "$BASE_REF"...HEAD -- \
            'models/*.py' 'timeline/*.py' ':(exclude)**/__init__.py')
          if [ -z "$CHANGED" ]; then
            echo "No pilot-scope files changed; skipping mutation testing."
            echo "in_scope=false" >> "$GITHUB_OUTPUT"
          else
            echo "Pilot-scope files changed:"
            echo "$CHANGED"
            echo "in_scope=true" >> "$GITHUB_OUTPUT"
          fi

      # setup-python + setup-uv must come AFTER the scope check.
      # If they run first and the scope check then skips everything,
      # the setup-uv post-action fails on cache cleanup
      # ("Cache path … does not exist on disk") because nothing was
      # installed.
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.in_scope == 'true'
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        if: steps.scope.outputs.in_scope == 'true'
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.scope.outputs.in_scope == 'true'
        run: uv sync --frozen --extra dev --extra openai --extra anthropic --extra telegram

      - name: Run mutmut on pilot scope
        if: steps.scope.outputs.in_scope == 'true'
        # No mutants/ cache. A restore-keys fallback would let a silent
        # mutmut crash (masked by ``|| true``) gate the PR on the prior
        # cached run's stats. Cold rebuild is ~10 min on Linux at this
        # scope and keeps the gate honest.
        # ``|| true`` is intentional: mutmut returns non-zero whenever
        # mutants survive. The threshold-enforce step below is the gate.
        run: uv run mutmut run --max-children 4 || true

      - name: Export mutation score
        if: steps.scope.outputs.in_scope == 'true'
        id: score
        run: |
          set -euo pipefail
          uv run mutmut export-cicd-stats
          cat mutants/mutmut-cicd-stats.json
          KILLED=$(jq '.killed' mutants/mutmut-cicd-stats.json)
          SURVIVED=$(jq '.survived' mutants/mutmut-cicd-stats.json)
          TOTAL_CHECKED=$((KILLED + SURVIVED))
          if [ "$TOTAL_CHECKED" -eq 0 ]; then
            echo "::error title=No mutants checked::mutmut produced no killed+survived mutants — runner likely failed"
            exit 1
          fi
          SCORE=$(awk -v k="$KILLED" -v t="$TOTAL_CHECKED" 'BEGIN { printf "%.1f", (k * 100.0) / t }')
          echo "Mutation score: ${SCORE}% (${KILLED} killed / ${TOTAL_CHECKED} checked)"
          echo "score=${SCORE}" >> "$GITHUB_OUTPUT"

      - name: Enforce mutation-score threshold
        # PR runs are the gate; manual dispatch is report-only.
        if: steps.scope.outputs.in_scope == 'true' && github.event_name == 'pull_request'
        env:
          # Calibrated from the introduction-PR baseline of 79.8% (540 killed / 677 checked).
          # Threshold = floor(baseline) - 2. Bump only after a sustained nightly improvement;
          # see CLAUDE.md "Mutation testing (pilot)" for ratchet rules.
          THRESHOLD: "77"
        run: |
          SCORE="${{ steps.score.outputs.score }}"
          awk -v s="$SCORE" -v t="$THRESHOLD" 'BEGIN {
            if (s+0 < t+0) {
              printf "Mutation score %s%% is below threshold %s%%\n", s, t
              exit 1
            }
            printf "Mutation score %s%% meets threshold %s%%\n", s, t
          }'

      - name: Upload mutmut artifact
        if: always() && steps.scope.outputs.in_scope == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: |
            mutants/mutmut-cicd-stats.json
          retention-days: 14

  test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run DB-backed tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run pytest tests/db/ -m db -v --cov --cov-report=xml --cov-fail-under=0

      - name: Upload DB coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-db
          path: coverage.xml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Required so ``tests/e2e/_select_agents.py`` can run
          # ``git diff --name-only $BASE...HEAD`` to decide which
          # real-LLM agent tests to invoke for this PR.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev --extra anthropic --extra openai

      - name: Select e2e tests based on diff
        id: select
        env:
          # On push to ``main`` run every real-LLM agent test
          # unconditionally so canon coverage is checked before deploy.
          # On PRs leave it empty so the matrix drives selection from
          # the actual diff.
          PYTEST_AGENT_TESTS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'all' || '' }}
        run: |
          set -euo pipefail
          # PRs diff against the merge-base (``pull_request.base.sha``).
          # Push events diff against ``github.event.before`` so a
          # multi-commit push isn't reduced to "the last commit only".
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="${{ github.event.before || 'HEAD^' }}"
          fi
          if [ -z "$BASE_REF" ]; then
            echo "::error title=Selector base ref missing::cannot diff without a base SHA"
            exit 1
          fi
          # Fail loud if the selector script itself crashes — a silent
          # empty stdout would be indistinguishable from "no e2e needed".
          if ! SELECTED=$(uv run python -m tests.e2e._select_agents --base "$BASE_REF"); then
            echo "::error title=Selector failed::tests/e2e/_select_agents.py exited non-zero"
            exit 1
          fi
          echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"
          if [ -z "$SELECTED" ]; then
            echo "No agent-relevant files changed; e2e step will be skipped."
          else
            echo "Selected e2e files:"
            for f in $SELECTED; do echo "  - $f"; done
          fi

      - name: Preflight — assert real-LLM secrets are present
        if: steps.select.outputs.selected != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # A missing or rotated secret would otherwise cause
          # ``real_llm_for`` to ``pytest.skip`` every test and the e2e
          # step would pass green with zero real-LLM coverage. Fail loud.
          #
          # Only OPENAI_API_KEY is asserted because every ``*_MODEL`` env
          # var below is ``gpt-*`` (OpenAI). If a model changes to a
          # Claude/DeepSeek/OpenRouter one, add the matching
          # ``${<PROVIDER>_API_KEY:?...}`` assertion here too.
          : "${OPENAI_API_KEY:?OPENAI_API_KEY secret is required for the e2e job}"

      - name: Run e2e tests
        if: steps.select.outputs.selected != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIRECTOR_MODEL: gpt-5.4-mini
          AGENT_MODEL: gpt-5.4-nano
          NARRATOR_MODEL: gpt-5.4-mini
          DRAMATURGE_MODEL: gpt-5.4-nano
        run: uv run pytest ${{ steps.select.outputs.selected }} --alluredir=allure-results -v

      - name: Upload Allure results
        if: always() && steps.select.outputs.selected != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn

      - name: Upload narrative quality logs
        if: always() && steps.select.outputs.selected != ''
        uses: actions/upload-artifact@v4
        with:
          name: narrative-quality-logs
          path: allure-results/logs/
          if-no-files-found: warn

      - name: Post narrative quality report on PR
        if: always() && steps.select.outputs.selected != '' && github.event_name == 'pull_request' && hashFiles('allure-results/narrative-report.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: narrative-quality-report
          path: allure-results/narrative-report.md

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test, test-db]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  publish-allure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, e2e]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download unit Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-unit
          path: allure-results

      - name: Download e2e Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results
          path: allure-results

      - name: Load Allure report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        uses: simple-elf/allure-report-action@v1.13
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: allure-results

      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
