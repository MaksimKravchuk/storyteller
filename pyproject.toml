[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storyteller"
version = "0.1.0"
description = "AI-powered text quest engine with theater-style multi-agent architecture"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "loguru>=0.7",
    "click>=8.1",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
telegram = ["python-telegram-bot>=21.0"]
dev = ["pytest", "pytest-asyncio", "mypy", "flake8", "wemake-python-styleguide"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["llm.*", "research.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["interfaces.telegram_bot", "interfaces.telegram_commands", "run_server"]
disable_error_code = ["union-attr"]

[tool.hatch.build.targets.wheel]
packages = ["cast", "config.py", "db", "defaults", "engine", "interfaces", "knowledge", "llm", "models", "prompts", "research", "timeline"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.0",
    "pre-commit>=4.5.1",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.15.8",
    "wemake-python-styleguide>=1.6.1",
    "allure-pytest>=2.13",
    "pytest-dotenv>=0.5",
    "pytest-cov>=4.0",
    "testcontainers>=4.8",
]

[tool.pytest.ini_options]
env_files = [".env"]
markers = [
    "db: requires a real Postgres (testcontainers)",
]
addopts = "-m 'not db'"

[tool.coverage.run]
source = ["cast", "engine", "models", "knowledge", "timeline", "llm", "prompts", "db", "interfaces", "research", "formatting"]
omit = ["tests/*", "alembic/*", "main.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
exclude = ["alembic/", ".venv/", "__pycache__", ".git"]
