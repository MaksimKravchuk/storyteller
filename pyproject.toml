[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storyteller"
version = "0.1.0"
description = "AI-powered text quest engine with theater-style multi-agent architecture"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "loguru>=0.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pymorphy3>=2.0",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
dev = ["pytest", "pytest-asyncio", "mypy", "flake8", "wemake-python-styleguide"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["alembic/", "mutants/", ".venv-mutmut/"]

[[tool.mypy.overrides]]
module = ["llm.*", "research.*"]
ignore_errors = true

[tool.hatch.build.targets.wheel]
packages = ["benchmarks", "cast", "config.py", "db", "defaults", "engine", "interfaces", "knowledge", "llm", "log_scrubbing.py", "models", "prompts", "research", "timeline"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.0",
    "pre-commit>=4.5.1",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.15.8",
    "wemake-python-styleguide>=1.6.1",
    "allure-pytest>=2.13",
    "pytest-dotenv>=0.5",
    "pytest-cov>=4.0",
    "testcontainers>=4.8",
    "httpx>=0.27",
    "hypothesis>=6.0",
    "mutmut>=3.5,<4",
]

[tool.pytest.ini_options]
env_files = [".env"]
markers = [
    "db: requires a real Postgres (testcontainers)",
    "benchmark: opt-in narration benchmarks that hit paid LLMs (see benchmarks/)",
    "live: opt-in live external-API smoke tests (require provider secrets, hit the network)",
]
addopts = "-m 'not db and not benchmark and not live'"

[tool.coverage.run]
source = ["cast", "engine", "models", "knowledge", "timeline", "llm", "prompts", "db", "interfaces", "research", "formatting"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
exclude = ["alembic/", ".venv/", ".venv-mutmut/", "mutants/", "__pycache__", ".git"]

[tool.mutmut]
# Pilot scope (ADR-0004) plus the deterministic-core expansion (ADR-0005):
# knowledge/ graph logic, db/converters/ domain<->ORM bridge, cast/dice.py
# contest math, and config.py provider detection. All are non-LLM and
# already unit-tested, so a survived mutant maps cleanly to a missing assert.
paths_to_mutate = [
  "models/",
  "timeline/",
  "knowledge/",
  "db/converters/",
  "cast/dice.py",
  "config.py",
]
tests_dir = ["tests/"]
mutate_only_covered_lines = true
# Copied verbatim so imports resolve, but not mutated. ``cast`` and ``db``
# stay here for the sibling modules of the mutated sub-paths (cast/dice.py,
# db/converters/); mutmut copies copy_also without clobbering the already
# written mutant files, so the overlap is safe (verified via the mutants/ tree).
also_copy = [
  "alembic",
  "alembic.ini",
  "benchmarks",
  "cast",
  "costs",
  "db",
  "defaults",
  "engine",
  "formatting",
  "interfaces",
  "llm",
  "log_scrubbing.py",
  "prompts",
  "research",
  "run_server.py",
  "safety",
]
pytest_add_cli_args = [
  "--no-cov",
  # Deselect async tests from every mutmut pytest invocation (coverage
  # gather, stats, per-mutant). Under mutmut's in-process ``pytest.main()``
  # runner, pytest_asyncio's event-loop-policy teardown raises
  # ``TypeError: loop must be an instance of AbstractEventLoop`` and aborts
  # the stats phase (killed=0). The expanded mutation surface (knowledge/,
  # config.py) widened the trampolined import graph enough to trip it where
  # the models/+timeline/ pilot did not. The mutated modules are pure and
  # densely covered by *sync* tests, so deselecting async tests keeps the
  # kill signal while sidestepping the teardown bug. ``-m`` is last-wins, so
  # this supersedes the ``addopts`` marker expression rather than conflicting.
  "-m",
  "not db and not benchmark and not asyncio",
  "--ignore=tests/e2e",
  "--ignore=tests/benchmarks",
  "--ignore=tests/db",
  # Hypothesis fuzz: mutmut re-runs the suite per mutant, which the
  # ``differing_executors`` health-check trips on.
  "--ignore=tests/test_director_routing_fuzz.py",
  # FastAPI / aiohttp I/O tests: mutmut force-disables
  # ``pytest-randomly``, which exposes test-ordering-dependent state
  # contamination in these integration suites. Mutating ``models/`` and
  # ``timeline/`` does not benefit from re-running these anyway — none
  # of them target the algorithmic surface mutmut covers.
  "--ignore-glob=tests/test_admin*.py",
  "--ignore-glob=tests/test_web*.py",
  # Same class as test_web*.py — the safety web-route test drives the FastAPI
  # app via TestClient and hits the Starlette BaseHTTPMiddleware async-teardown
  # crash ("No response returned") under mutmut's in-process pytest runner.
  "--ignore=tests/test_safety_web_api.py",
]
do_not_mutate = [
  "**/__init__.py",
  # LLM-driven knowledge modules: a survived mutant here needs a judge,
  # not an assert (ADR-0004 Alternative-2 reasoning), so they are copied
  # for imports but kept out of the mutation surface.
  "knowledge/memory.py",
  "knowledge/scene_consolidation.py",
  "knowledge/scene_summary_phase.py",
]
