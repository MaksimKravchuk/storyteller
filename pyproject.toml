[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storyteller"
version = "0.1.0"
description = "AI-powered text quest engine with theater-style multi-agent architecture"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
telegram = ["python-telegram-bot>=21.0"]
dev = ["pytest", "pytest-asyncio", "mypy"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["llm.*", "research.*"]
ignore_errors = true

[tool.hatch.build.targets.wheel]
packages = ["cast", "config.py", "defaults", "engine", "interfaces", "knowledge", "llm", "models", "prompts", "research", "timeline"]
