[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storyteller"
version = "0.1.0"
description = "AI-powered text quest engine with theater-style multi-agent architecture"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "loguru>=0.7",
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pymorphy3>=2.0",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
telegram = ["python-telegram-bot>=21.0"]
dev = ["pytest", "pytest-asyncio", "mypy", "flake8", "wemake-python-styleguide"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["alembic/", "mutants/", ".venv-mutmut/"]

[[tool.mypy.overrides]]
module = ["llm.*", "research.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["interfaces.telegram_bot"]
disable_error_code = ["union-attr"]

[tool.hatch.build.targets.wheel]
packages = ["benchmarks", "cast", "config.py", "db", "defaults", "engine", "interfaces", "knowledge", "llm", "log_scrubbing.py", "models", "prompts", "research", "timeline"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.0",
    "pre-commit>=4.5.1",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.15.8",
    "wemake-python-styleguide>=1.6.1",
    "allure-pytest>=2.13",
    "pytest-dotenv>=0.5",
    "pytest-cov>=4.0",
    "testcontainers>=4.8",
    "httpx>=0.27",
    "hypothesis>=6.0",
    "mutmut>=3.5,<4",
]

[tool.pytest.ini_options]
env_files = [".env"]
markers = [
    "db: requires a real Postgres (testcontainers)",
    "benchmark: opt-in narration benchmarks that hit paid LLMs (see benchmarks/)",
]
addopts = "-m 'not db and not benchmark'"

[tool.coverage.run]
source = ["cast", "engine", "models", "knowledge", "timeline", "llm", "prompts", "db", "interfaces", "research", "formatting"]
omit = ["tests/*", "alembic/*", "main.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
exclude = ["alembic/", ".venv/", ".venv-mutmut/", "mutants/", "__pycache__", ".git"]

[tool.mutmut]
paths_to_mutate = ["models/", "timeline/"]
tests_dir = ["tests/"]
mutate_only_covered_lines = true
also_copy = [
  "alembic",
  "alembic.ini",
  "benchmarks",
  "cast",
  "config.py",
  "costs",
  "db",
  "defaults",
  "engine",
  "formatting",
  "interfaces",
  "knowledge",
  "llm",
  "log_scrubbing.py",
  "main.py",
  "prompts",
  "research",
  "run_server.py",
]
pytest_add_cli_args = [
  "--no-cov",
  "--ignore=tests/e2e",
  "--ignore=tests/benchmarks",
  "--ignore=tests/db",
  # Hypothesis fuzz: mutmut re-runs the suite per mutant, which the
  # ``differing_executors`` health-check trips on.
  "--ignore=tests/test_director_routing_fuzz.py",
  # FastAPI / aiohttp / telegram I/O tests: mutmut force-disables
  # ``pytest-randomly``, which exposes test-ordering-dependent state
  # contamination in these integration suites. Mutating ``models/`` and
  # ``timeline/`` does not benefit from re-running these anyway — none
  # of them target the algorithmic surface mutmut covers.
  "--ignore-glob=tests/test_admin*.py",
  "--ignore-glob=tests/test_web*.py",
  "--ignore-glob=tests/test_telegram*.py",
]
do_not_mutate = [
  "**/__init__.py",
]
