[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storyteller"
version = "0.1.0"
description = "AI-powered text quest engine with theater-style multi-agent architecture"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
telegram = ["python-telegram-bot>=21.0"]
database = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "alembic>=1.13"]
dev = ["pytest", "pytest-asyncio", "mypy"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["llm.*", "research.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["interfaces.telegram_bot"]
disable_error_code = ["union-attr"]

[tool.hatch.build.targets.wheel]
packages = ["cast", "config.py", "db", "defaults", "engine", "interfaces", "knowledge", "llm", "models", "prompts", "research", "timeline"]
